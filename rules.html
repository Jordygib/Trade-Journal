<section id="r1" aria-labelledby="rh1" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh1" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">1. Sponsor</h2><div class="rules"><p>These awards are run by <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[company legal name]</mark> (“Trade Journal,” “we”), <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[business address]</mark>. Questions: <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[contact email]</mark>.</p></div></section><section id="r2" aria-labelledby="rh2" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh2" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">2. Not investment advice</h2><div class="rules"><p>Awards recognize past results and journaling habits. Nothing on Trade Journal, including rankings, awards, posts, or challenges, is investment advice or a recommendation to buy or sell anything. Trading options involves substantial risk of loss.</p></div></section><section id="r3" aria-labelledby="rh3" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh3" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">3. Eligibility</h2><div class="rules"><p>Open to individuals who are at least 18 years old (or the age of majority where they live, if higher) and legal residents of <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[eligible countries or states]</mark>. Employees and contractors of Trade Journal and their immediate household members are not eligible. Void where prohibited or restricted by law.</p><p>Performance awards (Trader of the Quarter, Most Improved, Discipline Award, Rookie of the Month) and the Year-End Championship require a broker account connected directly to Trade Journal. Trades imported only by CSV file do not count.</p></div></section><section id="r4" aria-labelledby="rh4" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh4" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">4. How to enter</h2><div class="rules"><p>No purchase or payment is necessary to enter or win. Every eligible member who opts in to rankings in their sharing settings is entered automatically. A paid plan does not improve anyone’s chances. Members can opt out at any time in Settings.</p></div></section><section id="r5" aria-labelledby="rh5" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh5" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">5. Award periods</h2><div class="rules"><p>Monthly awards and the quarterly Trader of the Quarter award run from 12:00 a.m. to 11:59 p.m. <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[time zone]</mark> on the first and last day of each calendar month or quarter. The <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[year]</mark> Year-End Championship runs from <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[season start date]</mark> to December 31, <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[year]</mark>.</p></div></section><section id="r6" aria-labelledby="rh6" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh6" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">6. How winners are chosen</h2><div class="rules"><ul><li><strong>Trader of the Quarter:</strong> highest score (return divided by maximum drawdown) for the calendar quarter, among members with trading activity in at least 8 of the quarter’s 13 weeks.</li><li><strong>Most Improved:</strong> largest increase in score versus the member’s previous month, with trading activity in at least 3 weeks of each month.</li><li><strong>Discipline Award:</strong> highest share of trades tagged “followed plan,” with zero revenge-trading or size-creep flags and trading activity in at least 3 weeks of the month.</li><li><strong>Most Helpful Member:</strong> the member with the most replies marked helpful during the month. Only the member who asked a question can mark a reply as helpful, and only one reply per question. Only marks from broker-verified members count, members can’t mark their own replies, and no more than 3 marks from the same member count toward any one person’s monthly total. Removed posts don’t count. Ties go to the member who helped the most different people.</li><li><strong>Rookie of the Month:</strong> highest score among members who joined within the previous 60 days, with trading activity in at least 2 weeks of the month.</li><li><strong>Year-End Championship:</strong> most Season points, earned only from the activities and amounts listed on the Awards page. Season points can’t be bought, transferred, or earned through purchases or referrals, and are never based on number of trades, position size, or profit. Monthly caps apply where listed.</li></ul><p>Ties are broken by the smaller maximum drawdown, then by the earlier date the member reached their final result. Number of trades is never used to rank or break ties.</p></div></section><section id="r7" aria-labelledby="rh7" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh7" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">7. Prizes</h2><div class="rules"><ul><li>Every monthly award winner: one free month of Skyscraper Unlimited (approximate retail value <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ value]</mark>).</li><li>Trader of the Quarter also receives an engraved metal trophy (approximate value <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ value]</mark>). Most Improved receives a <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ amount]</mark> digital gift card. Discipline Award and Rookie of the Month receive winners-only merchandise (approximate value <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ value]</mark>).</li><li>Year-End Championship: the top three split a prize pool of <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ prize pool]</mark>: 50% to first, 30% to second, and 20% to third.</li></ul><p>Prizes cannot be transferred or exchanged for cash, except that we may substitute a prize of equal or greater value. Winners are responsible for any taxes. Winners of prizes worth <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[$ threshold, e.g. 600]</mark> or more in a calendar year must provide tax information before receiving them.</p></div></section><section id="r8" aria-labelledby="rh8" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh8" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">8. Winner notification</h2><div class="rules"><p>Winners are announced on the Awards page on the first day of the following month and notified by email. Winners must respond within 7 days and complete any required forms, or an alternate winner may be selected. We may verify identity, age, and account details before awarding a prize.</p></div></section><section id="r9" aria-labelledby="rh9" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh9" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">9. Fair play and disqualification</h2><div class="rules"><p>One account per person. We may disqualify anyone who uses multiple accounts, manipulates trade data, coordinates votes, harasses other members, or otherwise acts unfairly. Results may be adjusted if a broker later corrects trade data.</p><p>Trophy points and Season points have no cash value, can’t be sold or transferred, and may be removed if earned in violation of these rules. Spending Trophy points never affects Season points.</p></div></section><section id="r10" aria-labelledby="rh10" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh10" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">10. Privacy</h2><div class="rules"><p>Personal information collected for these awards is used to run them and deliver prizes, as described in our <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[link to privacy policy]</mark>. Winners’ usernames and award results may be shown publicly.</p></div></section><section id="r11" aria-labelledby="rh11" style="padding: 18px 0; border-top: 1px solid #2B3B36"><h2 id="rh11" style="margin: 0 0 8px; font-size: 20px; font-weight: 600; font-family: 'Barlow Semi Condensed', sans-serif">11. Liability and changes</h2><div class="rules"><p>To the extent allowed by law, Trade Journal is not responsible for technical failures, broker data errors, or events outside its control. We may change, suspend, or end the awards if something prevents them from running fairly, with notice on the Awards page. These rules are governed by the laws of <mark style="padding: 0 4px; border-radius: 4px; border: 1px dashed #D8B25A; background: color-mix(in srgb, #D8B25A 12%, transparent); color: #E8CE8A">[governing state]</mark>.</p></div></section>
