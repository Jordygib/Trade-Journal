        toggle: () => { const nv = !this.state[t[0]]; this.setState({ [t[0]]: nv }); save({ [t[0]]: nv }, t[1] + (nv ? ' is on.' : ' is off.')).then((ok) => { if (!ok && REAL) this.setState({ [t[0]]: !nv }); }); } }; }),
      hasTrades: C.length > 0, noTrades: C.length === 0 };
    if (!C.length) return Object.assign(v, { stats: [], mix: [] });
    const wins = C.filter((t) => t.pnl > 0), gw = wins.reduce((s, t) => s + t.pnl, 0), gl = Math.abs(C.filter((t) => t.pnl < 0).reduce((s, t) => s + t.pnl, 0)), net = gw - gl;
    const days = {}; C.forEach((t) => { days[X.dayKey(t.c)] = 1; });
    const g = {}; C.forEach((t) => { const x = g[t.k] || (g[t.k] = { k: t.k, name: t.name, n: 0, tot: 0 }); x.n++; x.tot += t.pnl; });
    const gs = Object.values(g).sort((a, b) => b.n - a.n), best = Object.values(g).sort((a, b) => b.tot - a.tot)[0];
    v.stats = [{ k: 'Trades', v: String(C.length), c: '#FFFFFF', s: MN[C[0].c.getMonth()] + ' ' + C[0].c.getFullYear() + ' – ' + MN[C[C.length - 1].c.getMonth()] + ' ' + C[C.length - 1].c.getFullYear() },
      { k: 'Net P&L', v: money(net), c: net >= 0 ? gain : loss, s: 'All time' }, { k: 'Win rate', v: Math.round(wins.length / C.length * 100) + '%', c: '#FFFFFF', s: wins.length + ' of ' + C.length + ' won' },
      { k: 'Profit factor', v: gl ? (gw / gl).toFixed(2) : '—', c: !gl || gw >= gl ? '#FFFFFF' : loss, s: '$ won per $1 lost' }, { k: 'Trading days', v: String(Object.keys(days).length), c: '#FFFFFF', s: 'Days with a closed trade' },
      { k: 'Best strategy', v: best.name, c: '#FFFFFF', s: money(best.tot) + ' over ' + pl(best.n, 'trade') }];
    v.mix = gs.map((x) => ({ name: x.name, color: X.COLORS[x.k] || '#A2B4AC', n: pl(x.n, 'trade'), pct: Math.round(x.n / C.length * 100) + '%', w: Math.round(x.n / gs[0].n * 100) }));
    let e = 0; const eq = [0].concat(C.map((t) => (e += t.pnl)));
    let lo = Math.min(0, ...eq), hi = Math.max(0, ...eq); if (hi === lo) hi += 1; const pd = (hi - lo) * 0.08; lo -= pd; hi += pd;
    const xf = (i) => 6 + i / Math.max(1, eq.length - 1) * 628, yf = (y) => 8 + (hi - y) / (hi - lo) * 164;
    v.eqLine = 'M' + eq.map((y, i) => xf(i).toFixed(1) + ' ' + yf(y).toFixed(1)).join('L');
    v.eqArea = v.eqLine + 'L' + xf(eq.length - 1).toFixed(1) + ' ' + yf(0).toFixed(1) + 'L6 ' + yf(0).toFixed(1) + 'Z';
    v.eqZero = 'M6 ' + yf(0).toFixed(1) + 'H634'; v.eqColor = net >= 0 ? gain : loss; v.eqNote = money(net) + ' all time';
    v.eqStart = MN[C[0].c.getMonth()] + ' ' + C[0].c.getDate() + ', ' + C[0].c.getFullYear(); v.eqEnd = MN[C[C.length - 1].c.getMonth()] + ' ' + C[C.length - 1].c.getDate() + ', ' + C[C.length - 1].c.getFullYear();
    return v;
  }
}
