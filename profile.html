<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { photo: null, err: '' };
  }
  handleFile(file) {
    if (!file) return;
    if (!/^image\/(png|jpeg|webp|gif)$/.test(file.type)) { this.setState({ err: 'That file isn’t a supported image. Use PNG, JPG, WebP, or GIF.' }); return; }
    if (file.size > 5 * 1024 * 1024) { this.setState({ err: 'That photo is over 5 MB. Try a smaller one.' }); return; }
    const reader = new FileReader();
    reader.onerror = () => this.setState({ err: 'Couldn’t read that file. Try another photo.' });
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => this.setState({ err: 'Couldn’t open that image. Try another photo.' });
      img.onload = () => {
        const size = 320;
        const side = Math.min(img.naturalWidth, img.naturalHeight);
        const sx = (img.naturalWidth - side) / 2, sy = (img.naturalHeight - side) / 2;
        const cv = document.createElement('canvas');
        cv.width = size; cv.height = size;
        const ctx = cv.getContext('2d');
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, sx, sy, side, side, 0, 0, size, size);
        let out;
        try { out = cv.toDataURL('image/jpeg', 0.88); } catch (e) { out = reader.result; }
        this.setState({ photo: out, err: '' });
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }
  renderVals() {
    const st = this.state;
    return {
      accent: this.props.accent ?? '#D8B25A', gain: this.props.gain ?? '#4FD1B5', loss: this.props.loss ?? '#F0607A',
      photo: st.photo || '', hasPhoto: !!st.photo, noPhoto: !st.photo,
      uploadLabel: st.photo ? 'Change photo' : 'Upload photo',
      err: st.err, hasErr: !!st.err,
      onPhoto: (e) => { const f = e.target.files && e.target.files[0]; this.handleFile(f); try { e.target.value = ''; } catch (x) {} },
      removePhoto: () => this.setState({ photo: null, err: '' })
    };
  }
}
</script>
