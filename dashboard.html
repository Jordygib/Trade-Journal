.bgfx > *{position:relative;z-index:1}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,2%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main > *{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
main > *:nth-child(1){animation-delay:0.00s}main > *:nth-child(2){animation-delay:0.06s}main > *:nth-child(3){animation-delay:0.12s}main > *:nth-child(4){animation-delay:0.18s}main > *:nth-child(5){animation-delay:0.24s}main > *:nth-child(6){animation-delay:0.30s}main > *:nth-child(7){animation-delay:0.36s}main > *:nth-child(8){animation-delay:0.42s}main > *:nth-child(9){animation-delay:0.48s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .25s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.barU,.barD{transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.barU{transform-origin:50% 100%}.barD{transform-origin:50% 0%}
@keyframes grow{from{transform:scaleY(0)}}
.gx{transform-origin:left center;animation:gx 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
.cal > div{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.cal > div:nth-child(1){animation-delay:0.04s}.cal > div:nth-child(2){animation-delay:0.08s}.cal > div:nth-child(3){animation-delay:0.12s}.cal > div:nth-child(4){animation-delay:0.16s}.cal > div:nth-child(5){animation-delay:0.20s}.cal > div:nth-child(6){animation-delay:0.24s}.cal > div:nth-child(7){animation-delay:0.28s}.cal > div:nth-child(8){animation-delay:0.32s}.cal > div:nth-child(9){animation-delay:0.36s}.cal > div:nth-child(10){animation-delay:0.40s}.cal > div:nth-child(11){animation-delay:0.44s}.cal > div:nth-child(12){animation-delay:0.48s}.cal > div:nth-child(13){animation-delay:0.52s}.cal > div:nth-child(14){animation-delay:0.56s}.cal > div:nth-child(15){animation-delay:0.60s}
main section{transition:border-color .2s ease}
main section:hover{border-color:#3A4F49 !important}
.kpi{position:relative;transition:background-color .2s ease}
.kpi:hover{background:#16201D !important}
.kpi::before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:#D8B25A;transition:width .35s ease}
.kpi:hover::before{width:100%}
.trow{transition:background-color .15s ease}

button,a{transition:filter .15s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease}

button:active{transform:translateY(1px)}
.tape a:hover{background:#121A18}
.hdr-wrap{position:relative}
.hdr-wrap::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#D8B25A,transparent);background-size:35% 100%;background-repeat:no-repeat;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:-40% 0}to{background-position:140% 0}}
.pulse{position:relative;flex:none;width:7px;height:7px;border-radius:50%;background:#4FD1B5}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(79,209,181,.6);animation:ping 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 7px rgba(79,209,181,0)}}
.gold{box-shadow:inset 0 0 0 1px rgba(216,178,90,.45)}

@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}

<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) { super(...args); this.state = { range: null, calOff: 0 }; }

  tjx() {
    if (this._tjx) return this._tjx;
    const NAMES = { pcs: 'Put credit spread', ccs: 'Call credit spread', pds: 'Put debit spread', cds: 'Call debit spread', ic: 'Iron condor', ifly: 'Iron butterfly', condor: 'Condor', fly: 'Butterfly', bwb: 'Broken-wing butterfly', cal: 'Calendar', dcal: 'Double calendar', diag: 'Diagonal', ddiag: 'Double diagonal', long_call: 'Long call', long_put: 'Long put', short_call: 'Naked call', short_put: 'Naked put', sstrad: 'Short straddle', sstrang: 'Short strangle', lstrad: 'Long straddle', lstrang: 'Long strangle', ratio: 'Ratio spread', other: 'Other' };

    const sample = () => {
      const r = rng(77), out = []; const d = new Date(2026, 6, 6); const end = new Date(2026, 9, 20); let id = 0;
      const pick = () => { const x = r(); return x < 0.45 ? 'ic' : x < 0.7 ? 'pcs' : x < 0.85 ? 'fly' : x < 0.93 ? 'short_put' : 'bwb'; };
      const STR = { ic: '4 legs · 10-wide · SPX 0DTE', pcs: '2 legs · 10-wide · SPX 0DTE', fly: '3 legs · 10-wide · SPX 0DTE', short_put: '1 leg · SPX 0DTE', bwb: '3 legs · 5/10-wide · SPX 0DTE' };
      while (d <= end) {
        const w = d.getDay();

          const n = r() < 0.15 ? 0 : r() < 0.55 ? 1 : r() < 0.85 ? 2 : r() < 0.95 ? 3 : 4;

            const k = pick(); const om = 9 * 60 + 32 + Math.floor(r() * 330); const o = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(om / 60), om % 60);
            const early = om < 600; const pWin = (early ? 0.5 : 0.76) - (lastLoss ? 0.2 : 0) - (i >= 2 ? 0.15 : 0);
            const win = r() < pWin; const big = k === 'short_put' ? 3 : 1;

            out.push({ id: 's' + (++id), sym: 'SPX', k: k, name: NAMES[k], o: o, c: c, pnl: pnl, tk: true, qty: r() < 0.08 ? 2 : 1, expired: expired, structure: STR[k] });
            lastLoss = pnl < 0;

      }
      return out;
    };
    const dayKey = (d) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    const minsOf = (s) => { const m = String(s || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };

    const evaluate = (rules, L) => {
      const act = rules.filter((x) => x.on);
      const sorted = L.slice().sort((a, b) => a.o - b.o);
      const per = {}, idx = new Map();
      sorted.forEach((t) => { const k = dayKey(t.o); per[k] = (per[k] || 0) + 1; idx.set(t, per[k]); });
      const res = {}, broken = new Map(), checked = new Set();
      act.forEach((ru) => {
        const st = { canCheck: !!CHECKABLE[ru.kind], checked: 0, breaks: 0, folSum: 0, folN: 0, brkSum: 0, brkN: 0 };
        if (st.canCheck) sorted.forEach((t) => {
          let b = null; const v = Number(ru.val);

      return { per: res, checked: checked.size, followed: fn, pct: checked.size ? Math.round(fn / checked.size * 100) : null, breaks: list.length, brokenTrades: bn, folAvg: fn ? fs / fn : null, brkAvg: bn ? bs / bn : null, list: list };
    };

    return this._tjx;
  }

  renderVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A', accent = this.props.accent ?? '#D8B25A';
    const X = this.tjx(); const st = this.state;
    const REAL = Array.isArray(window.TJ_LITE) && window.TJ_LITE.length > 0;
    if (!this._all) this._all = REAL ? window.TJ_LITE : X.sample();
    const ALL = this._all;
    const NOW = REAL ? new Date() : new Date(2026, 9, 20, 17);
    const money = (n) => (n >= 0 ? '+$' : '−$') + Math.abs(Math.round(n)).toLocaleString('en-US');
    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const fd = (d) => MN[d.getMonth()] + ' ' + d.getDate();
    const last = ALL.reduce((m, t) => (!m || t.o > m ? t.o : m), null);
    const startOf = (r) => { if (r === 'all') return null; if (r === 'ytd') return new Date(NOW.getFullYear(), 0, 1); const d = new Date(NOW); d.setDate(d.getDate() - (r === '30d' ? 30 : 90)); return d; };
    let range = st.range;
    if (!range) { range = '90d'; const s0 = startOf('90d'); if (!ALL.some((t) => t.o >= s0)) range = 'all'; }
    const s0 = startOf(range);
    const L = ALL.filter((t) => !s0 || t.o >= s0).sort((a, b) => a.o - b.o);
    const C = L.filter((t) => t.c);
    const RL = { '30d': 'Last 30 days', '90d': 'Last 90 days', ytd: 'Year to date', all: 'All time' };
    const ranges = [['30d', '30D'], ['90d', '90D'], ['ytd', 'YTD'], ['all', 'All']].map((r) => ({ label: r[1], on: range === r[0], fg: range === r[0] ? '#FFFFFF' : '#8DA098', ac: range === r[0] ? accent : 'transparent', pick: () => this.setState({ range: r[0], calOff: 0 }) }));
    // rules
    const rules = Array.isArray(window.TJ_RULES) ? window.TJ_RULES.map((r) => ({ id: r.id, kind: r.kind, on: r.active, val: r.params && r.params.val != null ? r.params.val : null })) : (REAL ? [] : [{ id: 'a', kind: 'max_loss', on: true, val: 300 }, { id: 'b', kind: 'no_before', on: true, val: '10:00' }, { id: 'c', kind: 'max_trades', on: true, val: 2 }, { id: 'd', kind: 'max_size', on: true, val: 1 }, { id: 'e', kind: 'stop_entry', on: true, val: null }, { id: 'f', kind: 'cool_off', on: false, val: 60 }]);
    const onRules = rules.filter((r) => r.on);
    let rulesText, rulesCta;
    if (!rules.length) { rulesText = 'You haven’t set any rules yet. Pick the limits you want to trade by, and we’ll check every trade against them.'; rulesCta = 'Set up rules →'; }
    else if (!onRules.length) { rulesText = 'All your rules are switched off.'; rulesCta = 'Manage rules →'; }
    else { const ev = X.evaluate(rules, L); rulesText = onRules.length + ' on · ' + (ev.pct == null ? 'no trades in this range to check yet' : ev.pct + '% of trades followed every rule · ' + ev.breaks + (ev.breaks === 1 ? ' break' : ' breaks') + ' (' + RL[range].toLowerCase() + ')'); rulesCta = 'Manage rules →'; }
    const base = { gain, loss, accent, ranges, isSample: !REAL, isReal: REAL, rulesText, rulesCta, showAll: () => this.setState({ range: 'all' }),
      subtitle: (REAL ? '' : 'Sample data · ') + RL[range] + ' · ' + L.length + (L.length === 1 ? ' trade' : ' trades'),
      footNote: REAL ? 'P&L comes from your imported trades. Files without fees show P&L before commissions and fees.' : 'Sample data shown. Import a CSV to see your own numbers.',
      lastTradeText: last ? fd(last) + ', ' + last.getFullYear() : 'never' };
    if (!C.length) return Object.assign(base, { empty: true, hasData: false, hasInsight: false });
    // KPIs
    const wins = C.filter((t) => t.pnl > 0), losses = C.filter((t) => t.pnl < 0);
    const net = C.reduce((s, t) => s + t.pnl, 0), gw = wins.reduce((s, t) => s + t.pnl, 0), gl = Math.abs(losses.reduce((s, t) => s + t.pnl, 0));
    const wr = wins.length / C.length * 100, pf = gl ? gw / gl : null, aw = wins.length ? gw / wins.length : 0, al = losses.length ? gl / losses.length : 0;
    const byClose = C.slice().sort((a, b) => a.c - b.c);
    let eq = 0, peak = 0, dd = 0, ddAt = null, peakAt = byClose[0].o, ddFrom = null; const eqs = [0], dds = [0];
    byClose.forEach((t) => { eq += t.pnl; if (eq > peak) { peak = eq; peakAt = t.c; } const d = eq - peak; if (d < dd) { dd = d; ddAt = t.c; ddFrom = peakAt; } eqs.push(eq); dds.push(d); });
    const days = {}; L.forEach((t) => { days[X.dayKey(t.o)] = 1; }); const nDays = Object.keys(days).length;
    let prior = null; if (range === '30d' || range === '90d') { const n = range === '30d' ? 30 : 90; const p0 = new Date(s0); p0.setDate(p0.getDate() - n); const P = ALL.filter((t) => t.c && t.o >= p0 && t.o < s0); if (P.length) prior = P.reduce((s, t) => s + t.pnl, 0); }
    const spark = (arr) => { const n = arr.length; if (n < 2) return { line: '', area: '' }; let lo = Math.min(...arr), hi = Math.max(...arr); if (hi === lo) { hi += 1; lo -= 1; } const pts = arr.map((v, i) => [(i / (n - 1) * 94 + 1).toFixed(1), (27 - (v - lo) / (hi - lo) * 24).toFixed(1)]); const line = 'M' + pts.map((p) => p.join(' ')).join('L'); return { line, area: line + 'L95 30L1 30Z' }; };

    const kpis = [
      k('Net P&L', money(net), net >= 0 ? gain : loss, prior == null ? RL[range] : money(net - prior) + ' vs prior ' + (range === '30d' ? '30' : '90') + ' days', eqs, net >= 0 ? gain : loss),
      k('Win rate', wr.toFixed(1) + '%', '#FFFFFF', wins.length + ' of ' + C.length + ' closed trades', wrS, '#7AA2F7'),
      k('Profit factor', pf == null ? '—' : pf.toFixed(2), pf == null || pf >= 1 ? '#FFFFFF' : loss, pf == null ? 'No losing trades yet' : pf >= 1 ? 'Wins outweigh losses' : 'Losses outweigh wins', pfS, '#C792EA'),
      k('Avg win / loss', '$' + Math.round(aw) + ' / $' + Math.round(al), '#FFFFFF', al ? 'Ratio ' + (aw / al).toFixed(2) : 'No losses yet', C.map((t) => t.pnl), '#8DA098'),
      k('Max drawdown', dd < 0 ? money(dd) : '$0', dd < 0 ? loss : '#FFFFFF', dd < 0 && ddFrom ? fd(ddFrom) + ' – ' + fd(ddAt) : 'No drawdown', dds, loss),
      k('Trades', String(L.length), '#FFFFFF', (L.length / Math.max(1, nDays)).toFixed(1) + ' per trading day', cnt, accent)
    ];
    // equity svg
    const W = 640, H = 220, pad = 10; let lo = Math.min(0, ...eqs), hi = Math.max(0, ...eqs); if (hi === lo) hi += 1; const sp = (hi - lo) * 0.08; lo -= sp; hi += sp;
    const ex = (i) => pad + i / Math.max(1, eqs.length - 1) * (W - pad * 2 - 50), ey = (v) => pad + (hi - v) / (hi - lo) * (H - pad * 2);
    const eqLine = 'M' + eqs.map((v, i) => ex(i).toFixed(1) + ' ' + ey(v).toFixed(1)).join('L');
    const eqArea = eqLine + 'L' + ex(eqs.length - 1).toFixed(1) + ' ' + ey(0).toFixed(1) + 'L' + ex(0).toFixed(1) + ' ' + ey(0).toFixed(1) + 'Z';
    let pk = 0; const top = eqs.map((v) => { pk = Math.max(pk, v); return pk; });
    const eqDD = 'M' + top.map((v, i) => ex(i).toFixed(1) + ' ' + ey(v).toFixed(1)).join('L') + 'L' + eqs.slice().reverse().map((v, j) => ex(eqs.length - 1 - j).toFixed(1) + ' ' + ey(v).toFixed(1)).join('L') + 'Z';
    let eqGrid = ''; const eqY = []; [hi - sp, (hi + lo) / 2, lo + sp].forEach((v) => { const y = ey(v); eqGrid += 'M' + pad + ' ' + y.toFixed(1) + 'H' + (W - 50); eqY.push({ top: (y / H * 100).toFixed(1), text: money(v) }); });
    // strategies
    const g = {}; C.forEach((t) => { const x = g[t.k] || (g[t.k] = { k: t.k, name: t.name, n: 0, w: 0, net: 0 }); x.n++; if (t.pnl > 0) x.w++; x.net += t.pnl; });
    const sl = Object.values(g).sort((a, b) => b.net - a.net); const mx = Math.max(1, ...sl.map((x) => Math.abs(x.net)));
    const strats = sl.map((x) => ({ name: x.name, color: X.COLORS[x.k] || '#8DA098', net: money(x.net), pc: x.net >= 0 ? gain : loss, w: Math.max(3, Math.round(Math.abs(x.net) / mx * 100)), meta: x.n + (x.n === 1 ? ' trade' : ' trades') + ' · ' + Math.round(x.w / x.n * 100) + '% win · ' + money(x.net / x.n) + ' avg' }));
    // time of day
    const T = C.filter((t) => t.tk); const bk = {};
    T.forEach((t) => { const h = t.o.getHours(); const b = bk[h] || (bk[h] = { h, n: 0, s: 0 }); b.n++; b.s += t.pnl; });
    const bl = Object.values(bk).sort((a, b) => a.h - b.h); const bm = Math.max(1, ...bl.map((b) => Math.abs(b.s / b.n)));
    const tod = bl.map((b) => { const a = b.s / b.n; return { label: ((b.h + 11) % 12 + 1) + (b.h < 12 ? ' AM' : ' PM'), v: money(a), c: a >= 0 ? gain : loss, up: a > 0 ? Math.round(a / bm * 100) : 0, dn: a < 0 ? Math.round(-a / bm * 100) : 0, n: b.n + (b.n === 1 ? ' trade' : ' trades') }; });
    // managed vs held
    const M = C.filter((t) => t.expired === false), Hd = C.filter((t) => t.expired === true);
    const avg = (a) => a.length ? a.reduce((s, t) => s + t.pnl, 0) / a.length : null;
    const am = avg(M), ah = avg(Hd); const mm = Math.max(1, Math.abs(am || 0), Math.abs(ah || 0));
    const mg = [['Closed before expiration', M, am], ['Held to expiration', Hd, ah]].map((r) => ({ label: r[0], v: r[2] == null ? '—' : money(r[2]), c: r[2] == null ? '#8DA098' : r[2] >= 0 ? gain : loss, n: r[1].length + (r[1].length === 1 ? ' trade' : ' trades'), w: r[2] == null ? 0 : Math.max(3, Math.round(Math.abs(r[2]) / mm * 100)) }));
    const mgNote = am == null || ah == null ? 'Once you have trades of both kinds, you’ll see which way worked better for you.' : (am >= ah ? 'Closing early averaged ' + money(am - ah).replace('+', '') + ' more per trade in this range.' : 'Holding to expiration averaged ' + money(ah - am).replace('+', '') + ' more per trade in this range.');
    // calendar
    const lastD = C.reduce((m, t) => (t.c > m ? t.c : m), C[0].c);
    const cm = new Date(lastD.getFullYear(), lastD.getMonth() + st.calOff, 1);
    const dayP = {}; C.forEach((t) => { const k2 = X.dayKey(t.c); const d = dayP[k2] || (dayP[k2] = { s: 0, n: 0 }); d.s += t.pnl; d.n++; });
    const cal = []; const firstW = cm.getDay(); const dim = new Date(cm.getFullYear(), cm.getMonth() + 1, 0).getDate();
    let msum = 0, mup = 0, mdn = 0; const dmx = Math.max(1, ...Object.values(dayP).map((d) => Math.abs(d.s)));
    for (let i = 0; i < firstW; i++) cal.push({ day: '', v: '', n: '', bg: 'transparent', bd: 'transparent', c: '#8DA098', op: 1, title: '' });
    for (let d = 1; d <= dim; d++) { const dt = new Date(cm.getFullYear(), cm.getMonth(), d); const x = dayP[X.dayKey(dt)];
      if (x) { msum += x.s; if (x.s >= 0) mup++; else mdn++; const a = 10 + Math.round(Math.abs(x.s) / dmx * 30); cal.push({ day: String(d), v: money(x.s), n: x.n + (x.n === 1 ? ' trade' : ' trades'), bg: 'color-mix(in srgb, ' + (x.s >= 0 ? gain : loss) + ' ' + a + '%, #0F1614)', bd: 'color-mix(in srgb, ' + (x.s >= 0 ? gain : loss) + ' 40%, transparent)', c: x.s >= 0 ? gain : loss, op: 1, title: fd(dt) + ': ' + money(x.s) }); }
      else cal.push({ day: String(d), v: '', n: '', bg: '#0F1614', bd: '#1C2724', c: '#8DA098', op: dt.getDay() === 0 || dt.getDay() === 6 ? 0.45 : 1, title: '' }); }
    // flags
    const flags = [];
    const after = T.filter((t) => T.some((p) => p !== t && p.c && p.pnl < 0 && p.c <= t.o && t.o - p.c < 3600000));
    if (after.length) { const a1 = avg(after), oth = avg(T.filter((t) => after.indexOf(t) < 0)); flags.push({ title: 'Trades within an hour of a loss', v: money(a1) + ' avg', c: a1 < 0 ? loss : gain, text: after.length + (after.length === 1 ? ' trade' : ' trades') + (oth == null ? '' : ' · other trades averaged ' + money(oth)) }); }
    const perDay = {}; L.forEach((t) => { const k2 = X.dayKey(t.o); (perDay[k2] = perDay[k2] || []).push(t); });
    const busy = Object.values(perDay).filter((a) => a.length >= 3);
    if (busy.length) { const bs = busy.reduce((s, a) => s + a.reduce((q, t) => q + (t.c ? t.pnl : 0), 0), 0) / busy.length; flags.push({ title: 'Days with 3 or more trades', v: money(bs) + ' / day', c: bs < 0 ? loss : gain, text: busy.length + (busy.length === 1 ? ' day' : ' days') + ' in this range' }); }
    if (losses.length) { const worst = losses.reduce((m, t) => (t.pnl < m.pnl ? t : m)); flags.push({ title: 'Largest loss', v: money(worst.pnl), c: loss, text: worst.sym + ' ' + worst.name.toLowerCase() + ' on ' + fd(worst.o) + ' · ' + Math.round(Math.abs(worst.pnl) / gl * 100) + '% of all losses' }); }
    let streak = 0, best = 0; byClose.forEach((t) => { streak = t.pnl < 0 ? streak + 1 : 0; best = Math.max(best, streak); });
    flags.push({ title: 'Longest losing streak', v: best + (best === 1 ? ' trade' : ' trades'), c: best >= 3 ? loss : '#8DA098', text: best >= 3 ? 'Worth reviewing what happened during that run' : 'No long losing streaks' });
    // insight
    let insightLead = RL[range] + ':\u00a0', insightText;
    if (sl.length >= 2) insightText = 'your best strategy was ' + sl[0].name.toLowerCase() + ' (' + money(sl[0].net) + ' over ' + sl[0].n + (sl[0].n === 1 ? ' trade' : ' trades') + '), and your weakest was ' + sl[sl.length - 1].name.toLowerCase() + ' (' + money(sl[sl.length - 1].net) + ').';
    else insightText = C.length + ' closed ' + (C.length === 1 ? 'trade' : 'trades') + ' netted ' + money(net) + ' with a ' + wr.toFixed(0) + '% win rate.';
    const recent = L.slice().sort((a, b) => b.o - a.o).slice(0, 6).map((t) => ({ date: fd(t.o) + ', ' + t.o.getFullYear(), sym: t.sym, name: t.name, color: X.COLORS[t.k] || '#8DA098', structure: t.structure, pnl: t.c ? money(t.pnl) : 'Open', c: !t.c ? '#8DA098' : t.pnl >= 0 ? gain : loss }));
    return Object.assign(base, { empty: false, hasData: true, kpis, hasInsight: true, insightLead, insightText,
      netText: money(net), netColor: net >= 0 ? gain : loss, peakText: money(peak), ddText: dd < 0 ? money(dd) : '$0', eqLine, eqArea, eqDD, eqGrid, eqY, eqZero: 'M' + pad + ' ' + ey(0).toFixed(1) + 'H' + (W - 50),
      eqStart: fd(byClose[0].c) + ', ' + byClose[0].c.getFullYear(), eqEnd: fd(byClose[byClose.length - 1].c) + ', ' + byClose[byClose.length - 1].c.getFullYear(), eqNote: C.length + ' closed trades', eqAria: 'Equity curve ending at ' + money(net),
      strats, tod, hasTod: tod.length >= 2, noTod: tod.length < 2, todNote: T.length + ' trades with entry times',
      mg, mgNote, cal, calTitle: MN[cm.getMonth()] + ' ' + cm.getFullYear(), calSum: 'Month: ' + money(msum), calDays: mup + ' green · ' + mdn + ' red days',
      calPrev: () => this.setState({ calOff: this.state.calOff - 1 }), calNext: () => this.setState({ calOff: Math.min(0, this.state.calOff + 1) }),
      flags, recent });
  }
}
