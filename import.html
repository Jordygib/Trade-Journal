<script type="application/json" id="dc-props">{"accent":{"editor":"color","default":"#D8B25A","options":["#D8B25A","#D8B25A","#38BDF8"]},"gain":{"editor":"color","default":"#4FD1B5","options":["#4FD1B5","#38BDF8","#9ECE6A"]},"loss":{"editor":"color","default":"#F0607A","options":["#F0607A","#E0AF68","#9ECE6A"]},"$preview":{"width":1440,"height":1700}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { path: 'connect', broker: 'tasty', connecting: false, connected: false, file: null, map: {}, err: '', imported: false };
  }
  componentWillUnmount() { clearTimeout(this._t); }
  parseLine(line) {
    const out = []; let cur = '', q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === ',') { out.push(cur.trim()); cur = ''; } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  }
  guess(headers) {
    const FIELDS = [["date", "Date and time", true, ["date", "time", "executed", "datetime"]], ["symbol", "Symbol", true, ["symbol", "instrument", "contract"]], ["action", "Action", true, ["action", "side", "buy/sell", "transaction"]], ["qty", "Quantity", true, ["quantity", "qty", "contracts", "shares"]], ["price", "Price", true, ["average price", "avg price", "fill price", "price"]], ["fees", "Fees", false, ["fees", "fee", "commission"]], ["expiry", "Expiration", false, ["expiration", "expiry", "exp date"]], ["strike", "Strike", false, ["strike"]], ["cp", "Call or put", false, ["call or put", "put/call", "call/put", "option type"]]];
    const used = {}, map = {};
    FIELDS.forEach((f) => {
      const keys = f[3];
      let hit = -1;
      for (let k = 0; k < keys.length && hit < 0; k++) {
        for (let h = 0; h < headers.length; h++) { if (!used[h] && headers[h].toLowerCase().indexOf(keys[k]) >= 0) { hit = h; break; } }
      }
      if (hit >= 0) { used[hit] = true; map[f[0]] = String(hit); } else map[f[0]] = '';
    });
    return map;
  }
  loadFile(name, text) {
    const lines = text.split(/\r?\n/).filter((l) => l.trim().length);
    if (lines.length < 2) { this.setState({ err: 'That file looks empty. Export your trade history again and retry.', file: null }); return; }
    const headers = this.parseLine(lines[0]);
    const rows = lines.slice(1, 6).map((l) => this.parseLine(l));
    let parsed = null;
    try { if (window.TJImport) parsed = window.TJImport.parse(text, new Date()); } catch (e) { parsed = { ok: false, error: 'We couldn’t read this file. Try exporting it again.' }; }
    this.setState({ file: { name: name, headers: headers, rows: rows, count: lines.length - 1 }, map: this.guess(headers), err: '', imported: false, parsed: parsed, saving: false, saved: null, saveErr: '', broker: parsed && parsed.ok ? ({ tastytrade: 'tasty', schwab: 'schwab', thinkorswim: 'schwab', robinhood: 'robinhood', webull: 'webull' }[parsed.broker] || this.state.broker) : this.state.broker, path: 'csv' });
  }
  doSave() {
    const pr = this.state.parsed; if (!pr || !pr.ok) return;
    if (!window.tj || !window.TJImport) { this.setState({ saveErr: 'Sign in on your live Trade Journal site to save trades. This preview can’t save.' }); return; }
    this.setState({ saving: true, saveErr: '' });
    window.TJImport.save(window.tj, pr, this.state.file ? this.state.file.name : '').then((r) => this.setState({ saving: false, saved: r }), (e) => this.setState({ saving: false, saveErr: (e && e.message) ? e.message : 'Saving failed. Please try again.' }));
  }
  renderVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A', accent = this.props.accent ?? '#D8B25A';
    const st = this.state;
    const BROKERS = [["tasty", "tastytrade", "auto", "Desktop app: History → Transactions → CSV, or Trading → Activity export."], ["schwab", "Schwab / thinkorswim", "auto", "Schwab.com: Accounts → History → Transactions → Export. thinkorswim: Monitor → Account Statement → Export (CSV)."], ["robinhood", "Robinhood", "auto", "Account → Reports and statements → Reports → Account activity → CSV (it can take a few hours to arrive)."], ["webull", "Webull", "auto", "Webull desktop: Orders → Order History → Options → Export to CSV."], ["ibkr", "Interactive Brokers", "map", "Reports → Flex Queries → Trades as CSV, then match the columns."], ["fidelity", "Fidelity", "map", "Accounts → Activity & Orders → Download, then match the columns."], ["etrade", "E*TRADE", "map", "Accounts → Transactions → Download, then match the columns."], ["tradestation", "TradeStation", "map", "Trade history report as CSV, then match the columns."], ["other", "Another broker", "map", "Any trade history CSV works with column matching."]];
    const FIELDS = [["date", "Date and time", true, ["date", "time", "executed", "datetime"]], ["symbol", "Symbol", true, ["symbol", "instrument", "contract"]], ["action", "Action", true, ["action", "side", "buy/sell", "transaction"]], ["qty", "Quantity", true, ["quantity", "qty", "contracts", "shares"]], ["price", "Price", true, ["average price", "avg price", "fill price", "price"]], ["fees", "Fees", false, ["fees", "fee", "commission"]], ["expiry", "Expiration", false, ["expiration", "expiry", "exp date"]], ["strike", "Strike", false, ["strike"]], ["cp", "Call or put", false, ["call or put", "put/call", "call/put", "option type"]]];
    const br = BROKERS.find((b) => b[0] === st.broker) || BROKERS[0];
    const conn = st.path === 'connect';
    const sel = (on) => ({ bd: on ? accent : '#2B3B36', bg: on ? 'color-mix(in srgb, ' + accent + ' 9%, #151F1C)' : '#151F1C' });
    const brokers = BROKERS.map((b) => {
      const on = b[0] === st.broker;
      let status, sc;
      if (conn) { status = b[0] === 'other' ? 'Not available to connect yet' : 'Direct connection'; sc = b[0] === 'other' ? '#8A9C95' : gain; }
      else { status = b[2] === 'auto' ? 'CSV format recognized' : 'CSV with column matching'; sc = b[2] === 'auto' ? gain : '#E0AF68'; }
      return Object.assign({ name: b[1], on: on, status: status, statusColor: sc, pick: () => this.setState({ broker: b[0], connected: false, connecting: false }) }, sel(on));
    });
    const canConnect = br[0] !== 'other';
    const f = st.file;
    const fields = FIELDS.map((fd) => {
      const v = st.map[fd[0]] || '';
      const opts = [{ v: '', label: fd[2] ? 'Choose a column' : 'Not in my file' }].concat(f ? f.headers.map((h, i) => ({ v: String(i), label: h || ('Column ' + (i + 1)) })) : []);
      const ex = f && v !== '' && f.rows[0] ? (f.rows[0][Number(v)] || '—') : '—';
      const missing = fd[2] && v === '';
      return { label: fd[1], req: fd[2] ? 'Required' : 'Optional', reqColor: missing ? loss : '#A2B4AC', bd: missing ? 'color-mix(in srgb, ' + loss + ' 55%, #2B3B36)' : '#2B3B36', value: v, opts: opts, example: ex,
        set: (e) => { const m = Object.assign({}, this.state.map); m[fd[0]] = e.target.value; this.setState({ map: m, imported: false }); } };
    });
    const missingCount = FIELDS.filter((fd) => fd[2] && !(st.map[fd[0]])).length;
    const pvFields = FIELDS.slice(0, 5);
    const pvRows = f ? f.rows.slice(0, 4).map((r) => ({ cells: pvFields.map((fd) => { const v = st.map[fd[0]]; return v !== undefined && v !== '' ? (r[Number(v)] || '—') : '—'; }) })) : [];
    const cant = !f || missingCount > 0;
    return {
      gain, loss, accent, brokers,
      connOn: conn, csvOn: !conn,
      connOnBd: conn ? accent : '#2B3B36', connOnBg: conn ? 'color-mix(in srgb, ' + accent + ' 8%, #151F1C)' : '#151F1C',
      csvOnBd: !conn ? accent : '#2B3B36', csvOnBg: !conn ? 'color-mix(in srgb, ' + accent + ' 8%, #151F1C)' : '#151F1C',
      pickConnect: () => this.setState({ path: 'connect' }),
      pickCsv: () => this.setState({ path: 'csv' }),
      brokerNote: conn ? 'Direct connections run through a secure partner' : 'Any broker works. Unrecognized formats use column matching',
      brokerName: br[1],
      showConnect: conn, showCsv: !conn,
      notConnected: !st.connected, connected: st.connected, connecting: st.connecting || !canConnect,
      connectLabel: !canConnect ? 'Connection not available yet. Use a CSV' : (st.connecting ? 'Connecting…' : 'Connect ' + br[1]),
      doConnect: () => { if (!canConnect || this.state.connecting) return; this.setState({ connecting: true }); this._t = setTimeout(() => this.setState({ connecting: false, connected: true }), 1300); },
      exportTip: br[3] || (br[2] === 'auto' ? 'Export your full trade history from ' + br[1] + ' as CSV' : 'Export any trade or transaction history as CSV'),
      dropTitle: f ? f.name : 'Drop your CSV here or click to choose',
      dropSub: f ? f.count.toLocaleString('en-US') + ' rows · ' + f.headers.length + ' columns' : 'Trade or transaction history export',
      dropBd: f ? gain : '#3A4E47',
      onFile: (e) => {
        const file = e.target.files && e.target.files[0];
        try { e.target.value = ''; } catch (x) {}
        if (!file) return;
        if (!/\.csv$/i.test(file.name)) { this.setState({ err: 'Please choose a .csv file.' }); return; }
        if (file.size > 10 * 1024 * 1024) { this.setState({ err: 'That file is over 10 MB. Try exporting a shorter date range.' }); return; }
        const rd = new FileReader();
        rd.onload = () => this.loadFile(file.name, String(rd.result || ''));
        rd.onerror = () => this.setState({ err: 'Couldn’t read that file. Try exporting it again.' });
        rd.readAsText(file);
      },
      useSample: () => {
        const H = ["Date", "Type", "Action", "Symbol", "Instrument Type", "Description", "Value", "Quantity", "Average Price", "Commissions", "Fees", "Underlying Symbol", "Expiration Date", "Strike Price", "Call or Put"], R = [["2026-10-16T11:18:04", "Trade", "SELL_TO_OPEN", "SPXW 261016P05750000", "Equity Option", "Sold 1 SPXW 10/16/26 Put 5750.00 @ 1.48", "148.00", "1", "148.00", "-1.00", "-0.66", "SPX", "10/16/26", "5750", "PUT"], ["2026-10-16T11:18:04", "Trade", "BUY_TO_OPEN", "SPXW 261016P05740000", "Equity Option", "Bought 1 SPXW 10/16/26 Put 5740.00 @ 0.50", "-50.00", "1", "-50.00", "-1.00", "-0.66", "SPX", "10/16/26", "5740", "PUT"], ["2026-10-16T11:19:12", "Trade", "SELL_TO_OPEN", "SPXW 261016C05850000", "Equity Option", "Sold 1 SPXW 10/16/26 Call 5850.00 @ 1.28", "128.00", "1", "128.00", "-1.00", "-0.66", "SPX", "10/16/26", "5850", "CALL"], ["2026-10-16T11:19:12", "Trade", "BUY_TO_OPEN", "SPXW 261016C05860000", "Equity Option", "Bought 1 SPXW 10/16/26 Call 5860.00 @ 0.45", "-45.00", "1", "-45.00", "-1.00", "-0.66", "SPX", "10/16/26", "5860", "CALL"], ["2026-10-16T13:10:40", "Trade", "BUY_TO_CLOSE", "SPXW 261016P05750000", "Equity Option", "Bought 1 SPXW 10/16/26 Put 5750.00 @ 0.41", "-41.00", "1", "-41.00", "0.00", "-0.66", "SPX", "10/16/26", "5750", "PUT"]];
        const q = (c) => /[",]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c;
        const text = [H].concat(R).map((r) => r.map(q).join(',')).join('\n') + '\n' + new Array(737).fill(R[0].map(q).join(',')).join('\n');
        this.loadFile('sample-trades.csv', text);
      },
      err: st.err, hasErr: !!st.err, hasFile: !!f && !(st.parsed && st.parsed.ok), fields,
      ...(() => {
        const pr = st.parsed; const ok = !!(pr && pr.ok); const T = window.TJImport;
        const rowsP = ok ? pr.trades.map((t) => ({ date: T.fmtDate(t.opened_at), sym: t.underlying, strat: t.strategy_name, structure: t.structure, exit: t.exit_label, pnl: T.money(t.pnl), pc: t.pnl >= 0 ? gain : loss })) : [];
        return {
          hasParsed: ok, parsedLabel: ok ? pr.label : '', pOrders: ok ? pr.orders : 0, pFills: ok ? pr.fills : 0, pTrades: ok ? pr.trades.length : 0, pClosed: ok ? pr.closed : 0,
          pNet: ok ? T.money(pr.net) : '', pNetColor: ok && pr.net >= 0 ? gain : loss, pRows: rowsP,
          feeNote: ok && !pr.feesKnown ? 'This file has orders but not fees, so P&L is before commissions and fees. A transactions export adds fees automatically.' : '',
          hasFeeNote: ok && !pr.feesKnown, unknownFmt: !!(pr && !pr.ok && pr.unknown), parseErr: pr && !pr.ok && !pr.unknown ? pr.error : '', hasParseErr: !!(pr && !pr.ok && !pr.unknown),
          saving: !!st.saving, saved: !!st.saved, savedText: st.saved ? st.saved.trades + ' trades and ' + st.saved.fills + ' fills saved to your journal.' : '',
          saveErr: st.saveErr || '', hasSaveErr: !!st.saveErr, saveLabel: st.saving ? 'Saving…' : 'Save ' + (ok ? pr.trades.length : 0) + ' trades to my journal',
          doSave: () => this.doSave(), notSaved: !st.saved
        };
      })(),
      mapStatus: missingCount ? missingCount + ' required column' + (missingCount > 1 ? 's' : '') + ' still to match' : 'All required columns matched',
      mapStatusColor: missingCount ? loss : gain,
      pvHead: pvFields.map((fd) => fd[1]), pvRows,
      cantImport: cant, importBg: cant ? '#25332E' : accent, importFg: cant ? '#728680' : '#0C1110', importCursor: cant ? 'default' : 'pointer',
      importLabel: f ? 'Import ' + f.count.toLocaleString('en-US') + ' rows' : 'Import',
      importHint: cant ? (f ? 'Match the required columns first' : 'Choose a file to continue') : 'Duplicates from earlier imports are skipped automatically',
      doImport: () => { if (!cant) this.setState({ imported: true }); },
      imported: st.imported,
      importDone: f ? f.count.toLocaleString('en-US') + ' rows imported from ' + f.name + '.' : ''
    };
  }
