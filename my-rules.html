<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const T = [["max_loss", "Max loss per trade", "$", "", 300, "Risk", "Close any trade once it loses this much."], ["no_before", "No entries before", "", "", "10:00", "Timing", "Uses the times in your broker file."], ["max_trades", "Max trades per day", "", "trades", 2, "Discipline", "Stop opening new trades after this many."], ["max_size", "Max contracts per trade", "", "contracts", 1, "Risk", "Keep size fixed, even after a winning streak."], ["stop_entry", "Stop placed at entry", "", "", null, "Risk", "Every trade needs a stop order when it opens."], ["cool_off", "Cool-off after a loss", "", "min", 60, "Discipline", "Wait before the next trade after any loss."], ["loss_streak", "Stop after losses in a day", "", "losses", 2, "Discipline", "Done for the day after this many losses."], ["min_credit", "Minimum credit", "", "% of width", 12, "Setup", "Skip trades that don’t pay enough for the risk."], ["max_delta", "Max short-strike delta", "", "Δ", 20, "Setup", "Keep short strikes at or below this delta."], ["take_profit", "Take-profit order at", "", "% of max", 50, "Exits", "Place a profit target when you open."], ["vix_cap", "Skip when VIX is above", "", "", 22, "Timing", "Sit out high-volatility sessions."], ["tag_first", "Tag before every entry", "", "", null, "Discipline", "Pick a reason tag before placing a trade."]], ST = [["max_loss", true, "warn", 91, 5, 46, -118], ["no_before", true, "warn", 89, 2, 41, -42], ["max_trades", true, "warn", 94, 1, 38, -85], ["max_size", true, "warn", 86, 3, 44, -82], ["stop_entry", true, "log", 89, 6, 40, -190]];
    this.TPL = T;
    this.REAL = Array.isArray(window.TJ_RULES);
    const dv = (k) => { const t = T.find((x) => x[0] === k); return t ? t[4] : null; };
    const rules = this.REAL ? window.TJ_RULES.map((r) => { const pa = r.params || {}; return { id: r.id, kind: r.kind, on: !!r.active, alert: pa.alert || 'warn', val: pa.val != null ? pa.val : dv(r.kind), title: pa.title || '', desc: pa.desc || '', tag: pa.tag || '', cat: pa.cat || '' }; })
      : ST.map((s, i) => ({ id: 'r' + i, kind: s[0], on: s[1], alert: s[2], val: dv(s[0]) }));
    let sug = null;
    try { const q = new URLSearchParams(location.search); const k = q.get('add'); if (k && (k === 'custom' || T.some((x) => x[0] === k))) sug = { kind: k, val: q.get('val') != null ? q.get('val') : dv(k), title: (q.get('title') || '').slice(0, 80), tag: (q.get('tag') || '').slice(0, 24) }; } catch (e) {}
    this.state = { suggest: sug, adding: false, filter: 'all', msg: '', undoRule: null, rules: rules, cTitle: '', cDesc: '', cTag: '', cCat: 'Discipline', cErr: '' };
    this._n = rules.length; this._timers = {};
  }

  tjx() {
    if (this._tjx) return this._tjx;
    const NAMES = { pcs: 'Put credit spread', ccs: 'Call credit spread', pds: 'Put debit spread', cds: 'Call debit spread', ic: 'Iron condor', ifly: 'Iron butterfly', condor: 'Condor', fly: 'Butterfly', bwb: 'Broken-wing butterfly', cal: 'Calendar', dcal: 'Double calendar', diag: 'Diagonal', ddiag: 'Double diagonal', long_call: 'Long call', long_put: 'Long put', short_call: 'Naked call', short_put: 'Naked put', sstrad: 'Short straddle', sstrang: 'Short strangle', lstrad: 'Long straddle', lstrang: 'Long strangle', ratio: 'Ratio spread', other: 'Other' };
    const COLORS = { ic: '#38BDF8', pcs: '#C792EA', ccs: '#F7A8C0', pds: '#8FD6E8', cds: '#E8B38F', fly: '#E0AF68', bwb: '#F0C674', condor: '#8FD6E8', ifly: '#7DD3FC', cal: '#9ECE6A', dcal: '#9ECE6A', diag: '#F7A8C0', ddiag: '#F7A8C0', short_put: '#9ECE6A', short_call: '#F0607A', long_call: '#4FD1B5', long_put: '#E0AF68', other: '#A2B4AC' };
    const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    const sample = () => {
      const r = rng(77), out = []; const d = new Date(2026, 6, 6); const end = new Date(2026, 9, 20); let id = 0;
      const pick = () => { const x = r(); return x < 0.45 ? 'ic' : x < 0.7 ? 'pcs' : x < 0.85 ? 'fly' : x < 0.93 ? 'short_put' : 'bwb'; };
      const STR = { ic: '4 legs · 10-wide · SPX 0DTE', pcs: '2 legs · 10-wide · SPX 0DTE', fly: '3 legs · 10-wide · SPX 0DTE', short_put: '1 leg · SPX 0DTE', bwb: '3 legs · 5/10-wide · SPX 0DTE' };
      while (d <= end) {
        const w = d.getDay();
        if (w !== 0 && w !== 6) {
          const n = r() < 0.15 ? 0 : r() < 0.55 ? 1 : r() < 0.85 ? 2 : r() < 0.95 ? 3 : 4;
          let lastLoss = false;
          for (let i = 0; i < n; i++) {
            const k = pick(); const om = 9 * 60 + 32 + Math.floor(r() * 330); const o = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(om / 60), om % 60);
            const early = om < 600; const pWin = (early ? 0.5 : 0.76) - (lastLoss ? 0.2 : 0) - (i >= 2 ? 0.15 : 0);
            const win = r() < pWin; const big = k === 'short_put' ? 3 : 1;
            const pnl = Math.round(win ? (k === 'fly' || k === 'bwb' ? 90 + r() * 110 : 45 + r() * 70) : -(60 + r() * 130 * big));
            const expired = r() < 0.42; const hm = expired ? 16 * 60 - om : 20 + Math.floor(r() * 220); const c = new Date(o.getTime() + Math.min(hm, 16 * 60 - om) * 60000);
            out.push({ id: 's' + (++id), sym: 'SPX', k: k, name: NAMES[k], o: o, c: c, pnl: pnl, tk: true, qty: r() < 0.08 ? 2 : 1, expired: expired, structure: STR[k] });
            lastLoss = pnl < 0;
          }
        }
        d.setDate(d.getDate() + 1);
      }
      return out;
    };
    const dayKey = (d) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    const minsOf = (s) => { const m = String(s || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
    const CHECKABLE = { max_loss: 1, no_before: 1, max_trades: 1, max_size: 1, cool_off: 1, loss_streak: 1 };
    const evaluate = (rules, L) => {
      const act = rules.filter((x) => x.on);
      const sorted = L.slice().sort((a, b) => a.o - b.o);
      const per = {}, idx = new Map();
      sorted.forEach((t) => { const k = dayKey(t.o); per[k] = (per[k] || 0) + 1; idx.set(t, per[k]); });
      const res = {}, broken = new Map(), checked = new Set();
      act.forEach((ru) => {
        const st = { canCheck: !!CHECKABLE[ru.kind] || (ru.kind === 'custom' && !!ru.tag), checked: 0, breaks: 0, folSum: 0, folN: 0, brkSum: 0, brkN: 0 };
        if (st.canCheck) sorted.forEach((t) => {
          let b = null; const v = Number(ru.val);
          if (ru.kind === 'max_loss') { if (t.c) b = t.pnl < -Math.abs(v); }
          else if (ru.kind === 'no_before') { if (t.tk) { const lim = minsOf(ru.val); if (lim != null) b = t.o.getHours() * 60 + t.o.getMinutes() < lim; } }
          else if (ru.kind === 'max_trades') b = idx.get(t) > v;
          else if (ru.kind === 'max_size') b = (t.qty || 1) > v;
          else if (ru.kind === 'cool_off') { if (t.tk) b = sorted.some((p) => p !== t && p.tk && p.c && p.pnl < 0 && p.c <= t.o && t.o - p.c < v * 60000); }
          else if (ru.kind === 'custom') { if (t.c) { const tg = String(ru.tag || '').toLowerCase(); b = (t.tags || []).some((g) => String(g).toLowerCase() === tg); } }
          else if (ru.kind === 'loss_streak') { const dk = dayKey(t.o); b = sorted.filter((p) => p !== t && p.c && p.pnl < 0 && dayKey(p.c) === dk && p.c <= t.o).length >= v; }
          if (b === null || (isNaN(v) && ru.kind !== 'no_before' && ru.kind !== 'custom')) return;
          st.checked++; checked.add(t);
          if (b) { st.breaks++; st.brkSum += t.pnl; st.brkN++; if (!broken.has(t)) broken.set(t, []); broken.get(t).push(ru); }
          else { st.folSum += t.pnl; st.folN++; }
        });
        res[ru.id] = st;
      });
      let fs = 0, fn = 0, bs = 0, bn = 0;
      checked.forEach((t) => { if (broken.has(t)) { bs += t.pnl; bn++; } else { fs += t.pnl; fn++; } });
      const list = []; broken.forEach((rs, t) => rs.forEach((ru) => list.push({ t: t, rule: ru })));
      list.sort((a, b) => b.t.o - a.t.o);
      return { per: res, checked: checked.size, followed: fn, pct: checked.size ? Math.round(fn / checked.size * 100) : null, breaks: list.length, brokenTrades: bn, folAvg: fn ? fs / fn : null, brkAvg: bn ? bs / bn : null, list: list };
    };
    const ideas = (L, have) => {
      const C = L.filter((t) => t.c).sort((a, b) => a.o - b.o);
      const out = []; const m = (n) => (n >= 0 ? '+$' : '−$') + Math.abs(Math.round(n)).toLocaleString('en-US');
      const avg = (a) => a.length ? a.reduce((s, t) => s + t.pnl, 0) / a.length : 0;
      const pl = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
      const add = (kind, val, title, why, impact) => { if (have.indexOf(kind) < 0) out.push({ kind, val, title, why, impact }); };
      const T = C.filter((t) => t.tk);
      const after = T.filter((t) => T.some((p) => p !== t && p.pnl < 0 && p.c <= t.o && t.o - p.c < 3600000));
      const rest = T.filter((t) => after.indexOf(t) < 0);

  persist(op, r) {

    const uid = window.TJ_SESSION && window.TJ_SESSION.user ? window.TJ_SESSION.user.id : null;
    if (op !== 'insert' && String(r.id).indexOf('new') === 0) return Promise.resolve();
    if (op === 'insert') return sb.from('rules').insert({ user_id: uid, kind: r.kind, active: r.on, params: Object.assign({ val: r.val, alert: r.alert }, r.kind === 'custom' ? { title: r.title, desc: r.desc, tag: r.tag, cat: r.cat } : {}) }).select('id').single().then((x) => { if (x.error) err(x.error); return x.data; });
    if (op === 'delete') return sb.from('rules').delete().eq('id', r.id).then((x) => { if (x.error) err(x.error); });
    return sb.from('rules').update({ active: r.on, params: Object.assign({ val: r.val, alert: r.alert }, r.kind === 'custom' ? { title: r.title, desc: r.desc, tag: r.tag, cat: r.cat } : {}) }).eq('id', r.id).then((x) => { if (x.error) err(x.error); });

      const nr = Object.assign({}, r, patch);

      const t = tOf(r.kind, r); const hasVal = t[4] !== null; const isTime = r.kind === 'no_before'; const s = ev.per[r.id];
      const canCheck = !!X.CHECKABLE[r.kind] || (r.kind === 'custom' && !!r.tag);

        adh: adh, breaks: breaks, brColor: breaks !== '—' && +breaks > 0 ? loss : '#EFF5F2', fol: fol, brk: brk, alert: r.alert,

    });

      add: () => { if (u) return; this._n++; const nr = { id: 'new' + this._n, kind: t[0], on: true, alert: 'warn', val: t[4] };

      setCTitle: (ev) => this.setState({ cTitle: ev.target.value.slice(0, 80), cErr: '' }), setCDesc: (ev) => this.setState({ cDesc: ev.target.value.slice(0, 200) }), setCTag: (ev) => this.setState({ cTag: ev.target.value.slice(0, 24) }), setCCat: (ev) => this.setState({ cCat: ev.target.value }),

      const clearQ = () => { try { history.replaceState(null, '', location.pathname); } catch (e) {} };
      suggestV = { hasSuggest: true, sLabel: t0[1], sDesc: sg.kind === 'custom' ? (sg.tag ? 'Tracked by tagging trades “' + sg.tag + '”.' : '') : t0[6], sHasVal: t0[4] !== null, sPre: t0[2], sUnit: t0[3], sVal: sg.val == null ? '' : sg.val, sInType: sg.kind === 'no_before' ? 'time' : 'number',
        sExists: exists, sNote: exists ? 'You already have this rule. Adding it will update your number.' : 'Suggested from your Insights. Change the number if you like.',
        sSetVal: (ev) => this.setState({ suggest: Object.assign({}, this.state.suggest, { val: ev.target.value }) }),
        sDismiss: () => { clearQ(); this.setState({ suggest: null }); },
        sAdd: () => { clearQ();
          const ex = this.state.rules.find((r) => r.kind === sg.kind && sg.kind !== 'custom');

          this._n++; const nr = { id: 'new' + this._n, kind: sg.kind, on: true, alert: 'warn', val: sg.kind === 'custom' ? null : sg.val, title: sg.title, desc: '', tag: sg.tag, cat: 'Discipline' };

          this.persist('insert', nr).then((d) => { if (d && d.id) this.setState({ rules: this.state.rules.map((x) => x.id === nr.id ? Object.assign({}, x, { id: d.id }) : x) }); }).catch(() => {}); } }; }

    const ideaRows = X.ideas(L, have).map((i) => { const t = tOf(i.kind); return { title: i.title, why: i.why, cat: t[5], color: CAT[t[5]] || '#A2B4AC',
