.gx{transform-origin:left center;animation:gx 1s .3s cubic-bezier(.2,.7,.2,1) both}

.cal > div{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}

<script type="application/json" id="dc-props">{"accent":{"editor":"color","default":"#D8B25A","options":["#D8B25A","#D8B25A","#7AA2F7"]},"gain":{"editor":"color","default":"#4FD1B5","options":["#4FD1B5","#7AA2F7","#9ECE6A"]},"loss":{"editor":"color","default":"#F0607A","options":["#F0607A","#E0AF68","#9ECE6A"]},"$preview":{"width":1440,"height":1700}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const T = [["max_loss", "Max loss per trade", "$", "", 300, "Risk", "Close any trade once it loses this much."], ["no_before", "No entries before", "", "", "10:00", "Timing", "Uses the times in your broker file."], ["max_trades", "Max trades per day", "", "trades", 2, "Discipline", "Stop opening new trades after this many."], ["max_size", "Max contracts per trade", "", "contracts", 1, "Risk", "Keep size fixed, even after a winning streak."], ["stop_entry", "Stop placed at entry", "", "", null, "Risk", "Every trade needs a stop order when it opens."], ["cool_off", "Cool-off after a loss", "", "min", 60, "Discipline", "Wait before the next trade after any loss."], ["loss_streak", "Stop after losses in a day", "", "losses", 2, "Discipline", "Done for the day after this many losses."], ["min_credit", "Minimum credit", "", "% of width", 12, "Setup", "Skip trades that don’t pay enough for the risk."], ["max_delta", "Max short-strike delta", "", "Δ", 20, "Setup", "Keep short strikes at or below this delta."], ["take_profit", "Take-profit order at", "", "% of max", 50, "Exits", "Place a profit target when you open."], ["vix_cap", "Skip when VIX is above", "", "", 22, "Timing", "Sit out high-volatility sessions."], ["tag_first", "Tag before every entry", "", "", null, "Discipline", "Pick a reason tag before placing a trade."]], ST = [["max_loss", true, "warn", 91, 5, 46, -118], ["no_before", true, "warn", 89, 2, 41, -42], ["max_trades", true, "warn", 94, 1, 38, -85], ["max_size", true, "warn", 86, 3, 44, -82], ["stop_entry", true, "log", 89, 6, 40, -190], ["cool_off", false, "warn", null, 0, null, null]];
    this.TPL = T;
    this.REAL = Array.isArray(window.TJ_RULES);
    const dv = (k) => { const t = T.find((x) => x[0] === k); return t ? t[4] : null; };
    const rules = this.REAL ? window.TJ_RULES.map((r) => ({ id: r.id, kind: r.kind, on: !!r.active, alert: (r.params && r.params.alert) || 'warn', val: r.params && r.params.val != null ? r.params.val : dv(r.kind) }))
      : ST.map((s, i) => ({ id: 'r' + i, kind: s[0], on: s[1], alert: s[2], val: dv(s[0]) }));
    this.state = { adding: false, filter: 'all', msg: '', undoRule: null, rules: rules };
    this._n = rules.length; this._timers = {};
  }

  tjx() {
    if (this._tjx) return this._tjx;
    const NAMES = { pcs: 'Put credit spread', ccs: 'Call credit spread', pds: 'Put debit spread', cds: 'Call debit spread', ic: 'Iron condor', ifly: 'Iron butterfly', condor: 'Condor', fly: 'Butterfly', bwb: 'Broken-wing butterfly', cal: 'Calendar', dcal: 'Double calendar', diag: 'Diagonal', ddiag: 'Double diagonal', long_call: 'Long call', long_put: 'Long put', short_call: 'Naked call', short_put: 'Naked put', sstrad: 'Short straddle', sstrang: 'Short strangle', lstrad: 'Long straddle', lstrang: 'Long strangle', ratio: 'Ratio spread', other: 'Other' };
    const COLORS = { ic: '#7AA2F7', pcs: '#C792EA', ccs: '#F7A8C0', pds: '#8FD6E8', cds: '#E8B38F', fly: '#E0AF68', bwb: '#F0C674', condor: '#8FD6E8', ifly: '#9DBBFF', cal: '#9ECE6A', dcal: '#9ECE6A', diag: '#F7A8C0', ddiag: '#F7A8C0', short_put: '#9ECE6A', short_call: '#F0607A', long_call: '#4FD1B5', long_put: '#E0AF68', other: '#8DA098' };
    const rng = (seed) => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };
    const sample = () => {
      const r = rng(77), out = []; const d = new Date(2026, 6, 6); const end = new Date(2026, 9, 20); let id = 0;
      const pick = () => { const x = r(); return x < 0.45 ? 'ic' : x < 0.7 ? 'pcs' : x < 0.85 ? 'fly' : x < 0.93 ? 'short_put' : 'bwb'; };
      const STR = { ic: '4 legs · 10-wide · SPX 0DTE', pcs: '2 legs · 10-wide · SPX 0DTE', fly: '3 legs · 10-wide · SPX 0DTE', short_put: '1 leg · SPX 0DTE', bwb: '3 legs · 5/10-wide · SPX 0DTE' };
      while (d <= end) {
        const w = d.getDay();
        if (w !== 0 && w !== 6) {
          const n = r() < 0.15 ? 0 : r() < 0.55 ? 1 : r() < 0.85 ? 2 : r() < 0.95 ? 3 : 4;
          let lastLoss = false;
          for (let i = 0; i < n; i++) {
            const k = pick(); const om = 9 * 60 + 32 + Math.floor(r() * 330); const o = new Date(d.getFullYear(), d.getMonth(), d.getDate(), Math.floor(om / 60), om % 60);
            const early = om < 600; const pWin = (early ? 0.5 : 0.76) - (lastLoss ? 0.2 : 0) - (i >= 2 ? 0.15 : 0);
            const win = r() < pWin; const big = k === 'short_put' ? 3 : 1;
            const pnl = Math.round(win ? (k === 'fly' || k === 'bwb' ? 90 + r() * 110 : 45 + r() * 70) : -(60 + r() * 130 * big));
            const expired = r() < 0.42; const hm = expired ? 16 * 60 - om : 20 + Math.floor(r() * 220); const c = new Date(o.getTime() + Math.min(hm, 16 * 60 - om) * 60000);
            out.push({ id: 's' + (++id), sym: 'SPX', k: k, name: NAMES[k], o: o, c: c, pnl: pnl, tk: true, qty: r() < 0.08 ? 2 : 1, expired: expired, structure: STR[k] });
            lastLoss = pnl < 0;
          }
        }
        d.setDate(d.getDate() + 1);
      }
      return out;
    };
    const dayKey = (d) => d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    const minsOf = (s) => { const m = String(s || '').match(/(\d{1,2}):(\d{2})/); return m ? +m[1] * 60 + +m[2] : null; };
    const CHECKABLE = { max_loss: 1, no_before: 1, max_trades: 1, max_size: 1, cool_off: 1, loss_streak: 1 };
    const evaluate = (rules, L) => {
      const act = rules.filter((x) => x.on);
      const sorted = L.slice().sort((a, b) => a.o - b.o);
      const per = {}, idx = new Map();
      sorted.forEach((t) => { const k = dayKey(t.o); per[k] = (per[k] || 0) + 1; idx.set(t, per[k]); });
      const res = {}, broken = new Map(), checked = new Set();
      act.forEach((ru) => {
        const st = { canCheck: !!CHECKABLE[ru.kind], checked: 0, breaks: 0, folSum: 0, folN: 0, brkSum: 0, brkN: 0 };
        if (st.canCheck) sorted.forEach((t) => {
          let b = null; const v = Number(ru.val);
          if (ru.kind === 'max_loss') { if (t.c) b = t.pnl < -Math.abs(v); }
          else if (ru.kind === 'no_before') { if (t.tk) { const lim = minsOf(ru.val); if (lim != null) b = t.o.getHours() * 60 + t.o.getMinutes() < lim; } }
          else if (ru.kind === 'max_trades') b = idx.get(t) > v;
          else if (ru.kind === 'max_size') b = (t.qty || 1) > v;
          else if (ru.kind === 'cool_off') { if (t.tk) b = sorted.some((p) => p !== t && p.tk && p.c && p.pnl < 0 && p.c <= t.o && t.o - p.c < v * 60000); }
          else if (ru.kind === 'loss_streak') { const dk = dayKey(t.o); b = sorted.filter((p) => p !== t && p.c && p.pnl < 0 && dayKey(p.c) === dk && p.c <= t.o).length >= v; }
          if (b === null || isNaN(v) && ru.kind !== 'no_before') return;
          st.checked++; checked.add(t);
          if (b) { st.breaks++; st.brkSum += t.pnl; st.brkN++; if (!broken.has(t)) broken.set(t, []); broken.get(t).push(ru); }
          else { st.folSum += t.pnl; st.folN++; }
        });
        res[ru.id] = st;
      });
      let fs = 0, fn = 0, bs = 0, bn = 0;
      checked.forEach((t) => { if (broken.has(t)) { bs += t.pnl; bn++; } else { fs += t.pnl; fn++; } });
      const list = []; broken.forEach((rs, t) => rs.forEach((ru) => list.push({ t: t, rule: ru })));
      list.sort((a, b) => b.t.o - a.t.o);
      return { per: res, checked: checked.size, followed: fn, pct: checked.size ? Math.round(fn / checked.size * 100) : null, breaks: list.length, brokenTrades: bn, folAvg: fn ? fs / fn : null, brkAvg: bn ? bs / bn : null, list: list };
    };
    this._tjx = { NAMES, COLORS, sample, evaluate, dayKey, CHECKABLE };
    return this._tjx;
  }

  persist(op, r) {
    const sb = window.tj; if (!this.REAL || !sb) return Promise.resolve(r);
    const err = (e) => { this.setState({ msg: 'Couldn’t save that change. Check your connection and try again.' }); throw e; };
    if (op === 'insert') return sb.from('rules').insert({ kind: r.kind, active: r.on, params: { val: r.val, alert: r.alert } }).select('id').single().then((x) => { if (x.error) err(x.error); return x.data; });
    if (op === 'delete') return sb.from('rules').delete().eq('id', r.id).then((x) => { if (x.error) err(x.error); });
    return sb.from('rules').update({ active: r.on, params: { val: r.val, alert: r.alert } }).eq('id', r.id).then((x) => { if (x.error) err(x.error); });
  }
  renderVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A', accent = this.props.accent ?? '#D8B25A';
    const CAT = {"Risk": "#F0607A", "Timing": "#7AA2F7", "Discipline": "#C792EA", "Setup": "#4FD1B5", "Exits": "#E0AF68"};
    const st = this.state, T = this.TPL, X = this.tjx();
    if (!this._L) this._L = this.REAL ? (window.TJ_LITE || []) : X.sample();
    const L = this._L;
    const money = (n) => (n >= 0 ? '+$' : '−$') + Math.abs(Math.round(n)).toLocaleString('en-US');
    const MN = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const ev = X.evaluate(st.rules, L);
    const tOf = (k) => T.find((x) => x[0] === k) || [k, k, '', '', null, 'Other', ''];
    const ruleLabel = (r) => { const t = tOf(r.kind); return t[1] + (t[4] !== null ? ' (' + t[2] + r.val + (t[3] ? ' ' + t[3] : '') + ')' : ''); };
    const upd = (r, patch, msg, now) => {
      const nr = Object.assign({}, r, patch);
      this.setState({ rules: this.state.rules.map((x) => x.id === r.id ? nr : x), msg: msg || '', undoRule: null });
      clearTimeout(this._timers[r.id]);
      this._timers[r.id] = setTimeout(() => this.persist('update', nr).catch(() => {}), now ? 0 : 700);
    };
    const list = st.rules.filter((r) => st.filter === 'all' || (st.filter === 'on' ? r.on : !r.on));
    const rows = list.map((r) => {
      const t = tOf(r.kind); const hasVal = t[4] !== null; const isTime = r.kind === 'no_before'; const s = ev.per[r.id];
      const canCheck = !!X.CHECKABLE[r.kind];
      let adh, breaks = '—', fol = '—', brk = '—';
      if (!r.on) adh = 'Off';
      else if (!canCheck) adh = 'Not checked yet';
      else if (!s || !s.checked) adh = 'No trades yet';
      else { adh = Math.round(s.folN / s.checked * 100) + '%'; breaks = String(s.breaks); fol = s.folN ? money(s.folSum / s.folN) : '—'; brk = s.brkN ? money(s.brkSum / s.brkN) : '—'; }
      return { label: t[1], desc: t[6] + (canCheck ? '' : ' We can’t check this from broker files yet, but it’s saved for your reference.'), cat: t[5], color: CAT[t[5]] || '#8DA098', on: r.on, op: r.on ? 1 : 0.55, swBg: r.on ? accent : '#2E3F3A', knob: r.on ? '23px' : '3px',
        toggleLabel: (r.on ? 'Turn off ' : 'Turn on ') + t[1],
        hasVal: hasVal, pre: t[2], unit: t[3], val: hasVal ? r.val : '', inType: isTime ? 'time' : 'number', inW: isTime ? '112px' : (String(r.val).length > 3 ? '56px' : '44px'),
        adh: adh, breaks: breaks, brColor: breaks !== '—' && +breaks > 0 ? loss : '#E4ECE8', fol: fol, brk: brk, alert: r.alert,
        toggle: () => upd(r, { on: !r.on }, t[1] + (r.on ? ' is off. Its history is kept.' : ' is on.'), true),
        setVal: (ev2) => upd(r, { val: isTime ? ev2.target.value : ev2.target.value.replace(/[^0-9.]/g, '') }),
        setAlert: (ev2) => upd(r, { alert: ev2.target.value }, '', true),
        remove: () => { this.setState({ rules: this.state.rules.filter((x) => x.id !== r.id), msg: t[1] + ' was deleted.', undoRule: r }); this.persist('delete', r).catch(() => {}); } };
    });
    const used = st.rules.map((r) => r.kind);
    const tpl = T.map((t) => { const u = used.indexOf(t[0]) >= 0; return { label: t[1], desc: t[6], cat: t[5], color: CAT[t[5]], used: u, cursor: u ? 'default' : 'pointer', op: u ? 0.45 : 1, cta: u ? 'Already in your rules' : '+ Add this rule',
      add: () => { if (u) return; this._n++; const nr = { id: 'new' + this._n, kind: t[0], on: true, alert: 'warn', val: t[4] };
        this.setState({ rules: this.state.rules.concat([nr]), adding: false, msg: t[1] + ' was added and is on. Set your number below.', undoRule: null });
        this.persist('insert', nr).then((d) => { if (d && d.id) this.setState({ rules: this.state.rules.map((x) => x.id === nr.id ? Object.assign({}, x, { id: d.id }) : x) }); }).catch(() => {}); } }; });
    const filters = [['all', 'All'], ['on', 'On'], ['off', 'Off']].map((f) => ({ label: f[1], on: st.filter === f[0], fg: st.filter === f[0] ? '#FFFFFF' : '#A3B3AC', ac: st.filter === f[0] ? accent : 'transparent', pick: () => this.setState({ filter: f[0] }) }));
    const breakRows = ev.list.slice(0, 8).map((b) => ({ when: MN[b.t.o.getMonth()] + ' ' + b.t.o.getDate() + (b.t.tk ? ' · ' + String(b.t.o.getHours()).padStart(2, '0') + ':' + String(b.t.o.getMinutes()).padStart(2, '0') : ''), rule: ruleLabel(b.rule), trade: b.t.sym + ' ' + b.t.name.toLowerCase(), pnl: b.t.c ? money(b.t.pnl) : 'Open', pc: b.t.pnl >= 0 ? gain : loss }));
    return { gain, loss, accent, rows, tpl, filters, empty: rows.length === 0, isSample: !this.REAL,
      activeCount: st.rules.filter((r) => r.on).length, ruleCount: st.rules.length,
      sumPct: ev.pct == null ? '—' : ev.pct + '%', sumPctColor: ev.pct == null ? '#E4ECE8' : gain, sumPctSub: ev.checked ? 'of ' + ev.checked + ' trades checked' : 'No trades checked yet',
      sumBreaks: String(ev.breaks), sumBreaksSub: ev.brokenTrades ? 'across ' + ev.brokenTrades + (ev.brokenTrades === 1 ? ' trade' : ' trades') : 'Nothing broken',
      folAvg: ev.folAvg == null ? '—' : money(ev.folAvg), brkAvg: ev.brkAvg == null ? '—' : money(ev.brkAvg),
      breakRows, hasBreaks: breakRows.length > 0, noBreaks: breakRows.length === 0,
      adding: st.adding, openAdd: () => this.setState({ adding: true, msg: '' }), closeAdd: () => this.setState({ adding: false }),
      msg: st.msg, hasMsg: !!st.msg, canUndo: !!st.undoRule,
      undo: () => { const r = this.state.undoRule; if (!r) return; this.setState({ rules: this.state.rules.concat([r]), undoRule: null, msg: 'Rule restored.' }); this.persist('insert', r).then((d) => { if (d && d.id) this.setState({ rules: this.state.rules.map((x) => x.id === r.id ? Object.assign({}, x, { id: d.id }) : x) }); }).catch(() => {}); } };
  }
}
