    chart(roll.length ? roll : [0], 'pRoll', '#38BDF8');
    out.pRollLabel = 'Average of your last ' + win + ' trades'; out.pRollStart = byClose[Math.min(win - 1, byClose.length - 1)] ? fd(byClose[Math.min(win - 1, byClose.length - 1)].c) : ''; out.pRollEnd = fd(byClose[byClose.length - 1].c);
    out.pRollNote = roll.length >= 2 ? 'Your rolling average went from ' + money(roll[0]) + ' to ' + money(roll[roll.length - 1]) + ' per trade.' : 'Needs a few more trades.';
    const bestM = mrows.slice().sort((a, b) => b.raw - a.raw)[0], worstM = mrows.slice().sort((a, b) => a.raw - b.raw)[0];
    set('pChips', [{ k: 'Best month', v: bestM.net, c: bestM.raw >= 0 ? gain : loss, s: bestM.m }, { k: 'Worst month', v: worstM.net, c: worstM.raw >= 0 ? gain : loss, s: worstM.m }, { k: 'Months traded', v: String(mrows.length), c: '#FFFFFF', s: pl(C.length, 'trade') + ' total' }, { k: 'Green months', v: mrows.filter((m) => m.raw > 0).length + ' of ' + mrows.length, c: '#FFFFFF', s: 'Months with a positive net' }]);
    // ---------- WHAT-IF
    const wi = st.wi || {};
    const upd = (k) => (ev) => { const v = ev.target.type === 'checkbox' ? ev.target.checked : ev.target.value; this.setState({ wi: Object.assign({}, this.state.wi || {}, { [k]: v }) }); };
    const h0 = T.length ? Math.min(...T.map((t) => t.o.getHours())) : null;
    let L = C.slice();
    const act = [];
    if (wi.dow) { L = L.filter((t) => String(t.o.getDay()) !== String(wi.dow)); act.push('skipping ' + DN[+wi.dow] + 's'); }
    if (wi.strat) { L = L.filter((t) => t.name !== wi.strat); act.push('skipping ' + wi.strat.toLowerCase() + ' trades'); }
    if (wi.cool) { L = L.filter((t) => !(t.tk && C.some((p) => p !== t && p.pnl < 0 && p.c <= t.o && t.o - p.c < 3600000))); act.push('skipping trades within an hour of a loss'); }
    if (wi.early && h0 != null) { L = L.filter((t) => !(t.tk && t.o.getHours() === h0)); act.push('skipping entries before ' + fmtH(h0 + 1)); }
    if (+wi.max > 0) { const cnt = {}; L = L.filter((t) => { const k = X.dayKey(t.o); cnt[k] = (cnt[k] || 0) + 1; return cnt[k] <= +wi.max; }); act.push('max ' + wi.max + ' trades a day'); }
    const cap = +wi.cap > 0 ? +wi.cap : null; if (cap) act.push('capping losses at $' + cap);
    const P = L.map((t) => (cap ? Math.max(t.pnl, -cap) : t.pnl));
    const S = (arr) => { const n = arr.length, tot = arr.reduce((a, b) => a + b, 0), w = arr.filter((v) => v > 0), lo = Math.abs(arr.filter((v) => v < 0).reduce((a, b) => a + b, 0)); let e = 0, pk = 0, d = 0; arr.forEach((v) => { e += v; pk = Math.max(pk, e); d = Math.min(d, e - pk); }); return { n, tot, wr: n ? w.length / n * 100 : 0, pf: lo ? w.reduce((a, b) => a + b, 0) / lo : null, dd: d }; };
    const A = S(C.map((t) => t.pnl)), B = S(P);
    const diff = B.tot - A.tot;
    set('wChips', [{ k: 'Net P&L', v: money(B.tot), c: B.tot >= 0 ? gain : loss, s: 'Actual ' + money(A.tot) + ' · ' + (diff >= 0 ? '+' : '−') + '$' + Math.abs(Math.round(diff)).toLocaleString('en-US') }, { k: 'Trades kept', v: B.n + ' of ' + A.n, c: '#FFFFFF', s: pl(A.n - B.n, 'trade') + ' skipped' }, { k: 'Win rate', v: Math.round(B.wr) + '%', c: '#FFFFFF', s: 'Actual ' + Math.round(A.wr) + '%' }, { k: 'Max drawdown', v: B.dd < 0 ? money(B.dd) : '$0', c: B.dd < 0 ? loss : '#FFFFFF', s: 'Actual ' + (A.dd < 0 ? money(A.dd) : '$0') }]);
    const eqA = [], eqB = []; let ea = 0; C.forEach((t) => { ea += t.pnl; eqA.push(ea); }); let eb = 0; const keep = new Set(L); C.forEach((t) => { if (keep.has(t)) { eb += cap ? Math.max(t.pnl, -cap) : t.pnl; } eqB.push(eb); });
    chart(eqB, 'wEq', '#38BDF8', eqA);
    out.wEqStart = fd(C[0].o) + ', ' + C[0].o.getFullYear(); out.wEqEnd = fd(C[C.length - 1].o) + ', ' + C[C.length - 1].o.getFullYear();
    out.wActive = act.length ? 'Replaying with: ' + act.join(', ') + '.' : 'Pick one or more filters to replay your trades.';
    out.wNote = act.length ? (diff >= 0 ? 'With these filters, your past trades would have netted ' + money(diff).replace('+', '') + ' more.' : 'With these filters, your past trades would have netted ' + money(diff).replace('−', '') + ' less.') + ' This is a replay of past trades, not a prediction. Loss caps assume you could exit right at the cap.' : 'This replays your own past trades with the habits you pick. It isn’t a prediction or a recommendation.';
    out.wDow = wi.dow || ''; out.wStrat = wi.strat || ''; out.wCap = wi.cap || ''; out.wMax = wi.max || ''; out.wCool = !!wi.cool; out.wEarly = !!wi.early;
    set('wStrats', strat.map((x) => ({ k: x.name, name: x.name })));
    out.wSetDow = upd('dow'); out.wSetStrat = upd('strat'); out.wSetCap = upd('cap'); out.wSetMax = upd('max'); out.wSetCool = upd('cool'); out.wSetEarly = upd('early');
    out.wReset = () => this.setState({ wi: {} });
    return out;
  }

  fbVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A';
    const KEYS = ["edge_at_a_glance", "biggest_leaks", "by_strategy", "avg_result_by_entry_hour", "by_day_of_week", "by_underlying", "credit_or_debit", "by_hold_time", "risk_at_a_glance", "largest_losses", "loss_sizes", "drawdown", "position_size", "closed_early_or_held_to_expiration", "how_long_you_hold_winners_and_losers", "same_day_or_overnight", "premium_per_contract_at_entry", "after_a_win_or_a_loss", "trades_per_day", "first_trade_of_the_day_vs_later", "by_tag", "streaks", "your_rules", "month_by_month", "rolling_expectancy", "highlights", "result"];
    if (!this._fb) this._fb = Object.assign({}, window.TJ_FEEDBACK || {});
    const fb = this._fb, out = {};
    const set = (key, val) => {
      const prev = fb[key]; const next = prev === val ? null : val;
      if (next === null) delete fb[key]; else fb[key] = next;
      this.setState({ fbTick: (this.state.fbTick || 0) + 1 });
      const sb = window.tj, uid = window.TJ_SESSION && window.TJ_SESSION.user ? window.TJ_SESSION.user.id : null;
      if (!sb || !uid) return;
      if (next === null) sb.from('insight_feedback').delete().eq('user_id', uid).eq('card', key).then(() => {}, () => {});
      else sb.from('insight_feedback').upsert({ user_id: uid, card: key, helpful: next, updated_at: new Date().toISOString() }, { onConflict: 'user_id,card' }).then(() => {}, () => {});
    };
    KEYS.forEach((k) => { const v = fb[k];
      out['fb_' + k] = [{ q: v === true ? 'Thanks! Glad this helped.' : v === false ? 'Thanks. We’ll use this to improve it.' : 'Was this helpful?', isYes: v === true, isNo: v === false,
        yBd: v === true ? gain : '#3A4E47', yBg: v === true ? 'color-mix(in srgb, ' + gain + ' 16%, transparent)' : 'transparent', yFg: v === true ? gain : '#CFDAD5',
        nBd: v === false ? loss : '#3A4E47', nBg: v === false ? 'color-mix(in srgb, ' + loss + ' 14%, transparent)' : 'transparent', nFg: v === false ? loss : '#CFDAD5',
        yes: () => set(k, true), no: () => set(k, false) }]; });
    return out;
  }
  /*end-tabVals*/
  renderVals() { return Object.assign(this._baseVals(), this.calVals(), this.ovVals(), this.tabVals(), this.fbVals()); }
}
</script>
