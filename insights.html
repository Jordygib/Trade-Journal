    const fd = (d) => MN[d.getMonth()] + ' ' + d.getDate();
    const DG = '#0B8F74', DL = '#D5345A';
    const dayP = {}; C.forEach((t) => { const k = X.dayKey(t.c); const d = dayP[k] || (dayP[k] = { s: 0, n: 0, w: 0, ts: [] }); d.s += t.pnl; d.n++; if (t.pnl > 0) d.w++; d.ts.push(t); });
    const allVals = Object.values(dayP).map((d) => d.s);
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const last = C.length ? new Date(Math.max(...C.map((t) => t.c.getTime()))) : new Date(today);
    const WEEKS = 18, off = st.calOff || 0;
    const endMon = new Date(last.getFullYear(), last.getMonth(), last.getDate()); endMon.setDate(endMon.getDate() - ((endMon.getDay() + 6) % 7) + off * WEEKS * 7);
    const startMon = new Date(endMon); startMon.setDate(startMon.getDate() - (WEEKS - 1) * 7);
    const inWin = []; for (let w = 0; w < WEEKS; w++) for (let i = 0; i < 5; i++) { const dt = new Date(startMon); dt.setDate(dt.getDate() + w * 7 + i); const x = dayP[X.dayKey(dt)]; if (x) inWin.push(x.s); }
    const mx = Math.max(1, ...inWin.map(Math.abs)), best = inWin.length ? Math.max(...inWin) : null, worst = inWin.length ? Math.min(...inWin) : null;
    let green = 0, red = 0, tot = 0, prevM = -1;
    const pickDay = (key, dt) => this.setState({ calDay: st.calDay === key ? null : key, calDate: dt });
    const calWeeks = [];
    for (let w = 0; w < WEEKS; w++) {
      const mon = new Date(startMon); mon.setDate(mon.getDate() + w * 7);
      const label = mon.getMonth() !== prevM ? MN[mon.getMonth()] : ''; prevM = mon.getMonth();
      const days = [];
      for (let i = 0; i < 5; i++) {
        const dt = new Date(mon); dt.setDate(dt.getDate() + i); const key = X.dayKey(dt); const x = dayP[key]; const sel = st.calDay === key; const future = dt > today;
        const pick = future ? () => {} : () => pickDay(key, dt);
        const kd = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); pick(); } };
        const ring = sel ? '0 0 0 2px #FFFFFF, 0 0 0 4px ' + accent : 'none';
        if (x) {
          tot += x.s; if (x.s >= 0) green++; else red++;
          const a = 30 + Math.round(Math.abs(x.s) / mx * 70);
          let note = x.n > 1 ? x.w + ' of ' + x.n + ' trades won' : x.ts[0].name;
          if (inWin.length > 1 && x.s === best && x.s > 0) note = 'Best day in this view'; else if (inWin.length > 1 && x.s === worst && x.s < 0) note = 'Worst day in this view';
          days.push({ dn: String(dt.getDate()), cv: money(x.s), cls: 'calc', has: true, sel: sel, ring: ring, op: 1, pick: pick, key: kd, bg: 'color-mix(in srgb, ' + (x.s >= 0 ? gain : loss) + ' ' + a + '%, #18231F)',
            aria: DF[dt.getDay()] + ', ' + fd(dt) + ': ' + money(x.s) + ', ' + x.n + (x.n === 1 ? ' trade' : ' trades'), tipCls: 'tip' + (w < 2 ? ' l' : w >= WEEKS - 2 ? ' r' : ''), tc: x.s >= 0 ? DG : DL, td: DF[dt.getDay()].slice(0, 3) + ', ' + fd(dt), tv: money(x.s), tn: note });
        } else days.push({ dn: String(dt.getDate()), cv: '', cls: future ? '' : 'calc calz', has: false, sel: sel, ring: ring, op: future ? 0.35 : 1, pick: pick, key: kd, bg: '#1E2925', aria: DF[dt.getDay()] + ', ' + fd(dt) + (future ? '' : ': no trades'), tipCls: 'tip', tc: '', td: '', tv: '', tn: '' });
      }
      calWeeks.push({ label: label, days: days });
    }
    const endFri = new Date(endMon); endFri.setDate(endFri.getDate() + 4);
    if (!this._fsBound) { this._fsBound = true; this.setCalSec = (el) => { this._calSec = el; }; document.addEventListener('fullscreenchange', () => this.setState({ calFs: !!document.fullscreenElement && document.fullscreenElement === this._calSec })); }
    const out = { setCalSec: this.setCalSec, calFsLabel: st.calFs ? 'Exit full screen' : 'Open calendar full screen', calFsShort: st.calFs ? 'Exit' : 'Full screen',
      calFsToggle: () => { try { if (document.fullscreenElement) document.exitFullscreen(); else if (this._calSec && this._calSec.requestFullscreen) this._calSec.requestFullscreen(); } catch (e) {} },
      calReal: REAL, calWeeks, calCols: WEEKS, calRange: fd(startMon) + ' – ' + fd(endFri) + ', ' + endFri.getFullYear(),
      calPrev: () => this.setState({ calOff: (this.state.calOff || 0) - 1 }), calNext: () => this.setState({ calOff: Math.min(0, (this.state.calOff || 0) + 1) }), calNoNext: off >= 0, calNextOp: off >= 0 ? 0.35 : 1,
      calSummary: inWin.length ? green + ' green ' + (green === 1 ? 'day' : 'days') + ' and ' + red + ' red ' + (red === 1 ? 'day' : 'days') + ' in this view, totaling ' + money(tot) + '.' : 'No trades in these weeks. Use the arrows to look earlier.',
      hasDay: false, dayEmpty: false, dayHas: false, dayStats: [], dayChips: [], dayRows: [], dayClose: () => this.setState({ calDay: null }) };
    if (st.calDay && st.calDate) {
      const dt = st.calDate, x = dayP[st.calDay];
      out.hasDay = true; out.dayKicker = x ? 'DAY BREAKDOWN' : 'NO TRADES'; out.dayTitle = DF[dt.getDay()] + ', ' + MF[dt.getMonth()] + ' ' + dt.getDate() + ', ' + dt.getFullYear();
      out.dayBd = x ? (x.s >= 0 ? 'color-mix(in srgb, ' + gain + ' 45%, #2B3B36)' : 'color-mix(in srgb, ' + loss + ' 45%, #2B3B36)') : '#3A4E47';
      out.dayGlow = x ? (x.s >= 0 ? 'color-mix(in srgb, ' + gain + ' 10%, #151F1C)' : 'color-mix(in srgb, ' + loss + ' 10%, #151F1C)') : '#151F1C';
      if (!x) { out.dayEmpty = true; out.dayEmptyText = 'You didn’t close any trades on this day.'; }
      else {
        out.dayHas = true;
        const ts = x.ts.slice().sort((a, b) => a.o - b.o);
        const bestT = ts.reduce((m, t) => (t.pnl > m.pnl ? t : m)), worstT = ts.reduce((m, t) => (t.pnl < m.pnl ? t : m));
        out.dayStats = [
          { k: 'Day P&L', v: money(x.s), c: x.s >= 0 ? gain : loss, s: x.n + (x.n === 1 ? ' trade closed' : ' trades closed') },
          { k: 'Win rate', v: Math.round(x.w / x.n * 100) + '%', c: '#FFFFFF', s: x.w + ' of ' + x.n + ' won' },
          { k: 'Best trade', v: money(bestT.pnl), c: bestT.pnl >= 0 ? gain : loss, s: bestT.sym + ' ' + bestT.name.toLowerCase() },
          { k: 'Worst trade', v: money(worstT.pnl), c: worstT.pnl >= 0 ? gain : loss, s: worstT.sym + ' ' + worstT.name.toLowerCase() } ];
        const wk = new Date(dt); wk.setDate(wk.getDate() - ((wk.getDay() + 6) % 7)); let wsum = 0, msum = 0;
        Object.keys(dayP).forEach((k) => { const ts2 = dayP[k].ts[0].c; const d0 = new Date(ts2.getFullYear(), ts2.getMonth(), ts2.getDate()); if (d0 >= wk && d0 < new Date(wk.getTime() + 7 * 86400000)) wsum += dayP[k].s; if (d0.getMonth() === dt.getMonth() && d0.getFullYear() === dt.getFullYear()) msum += dayP[k].s; });
        const pct = allVals.length > 1 ? Math.round(allVals.filter((v) => v < x.s).length / (allVals.length - 1) * 100) : null;
        out.dayChips = ['Week total ' + money(wsum), MF[dt.getMonth()] + ' total ' + money(msum)].concat(pct == null ? [] : ['Better than ' + pct + '% of your trading days']);
        const hold = (t) => { if (!t.c) return '—'; if (!t.tk) { const a = new Date(t.o.getFullYear(), t.o.getMonth(), t.o.getDate()), b = new Date(t.c.getFullYear(), t.c.getMonth(), t.c.getDate()); const dd = Math.round((b - a) / 86400000); return dd <= 0 ? 'Same day' : dd + (dd === 1 ? ' day' : ' days'); } const m = Math.round((t.c - t.o) / 60000); if (m < 60) return m + 'm'; const d = Math.floor(m / 1440); return d >= 1 ? d + (d === 1 ? ' day' : ' days') : Math.floor(m / 60) + 'h ' + (m % 60) + 'm'; };
        out.dayRows = ts.map((t) => ({ opened: fd(t.o) + (t.tk ? ' · ' + String(t.o.getHours()).padStart(2, '0') + ':' + String(t.o.getMinutes()).padStart(2, '0') : ''), sym: t.sym, name: t.name, color: X.COLORS[t.k] || '#A2B4AC', structure: t.structure || '—', exit: t.expired === true ? 'Held to expiration' : t.expired === false ? 'Closed early' : 'Closed', hold: hold(t), pnl: money(t.pnl), c: t.pnl >= 0 ? gain : loss }));
      }
    }
    return out;
  }
  renderVals() { return Object.assign(this._baseVals(), this.calVals()); }
}
