nt-size: 13px; color: {{dataMsgColor}}">{{dataMsg}}</p></template><template data-scif value="{{clearShow}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 12px; padding: 14px; border-radius: 6px; border: 1px solid rgba(240,96,122,.5); background: rgba(240,96,122,.06)"><p style="margin: 0 0 10px; font-size: 13px; color: #F7C4CE">This permanently deletes all your trades, fills, notes, tags, and import history. You can import your CSV again afterward.</p><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #CFDAD5">Type DELETE to confirm<input type="text" value="{{clearTyped}}" onChange="{{clearSetTyped}}" autocomplete="off" style="width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 12px; border: 1px solid #3A4E47; border-radius: 6px; background: #111A17; color: #EFF5F2; font: inherit; font-size: 14px"></label><div style="display: flex; gap: 8px; margin-top: 10px"><button type="button" onClick="{{clearCancel}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #3A4E47; border-radius: 6px; background: transparent; color: #EFF5F2; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Cancel</button><button type="button" onClick="{{clearGo}}" disabled="{{clearDisabled}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid rgba(240,96,122,.6); border-radius: 6px; background: rgba(240,96,122,.08); color: #F7A8B8; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; opacity: {{clearOp}}">Delete all trades</button></div></div></template></section>
<section aria-labelledby="sp6" style="background: rgba(25, 36, 32, 0.92); border: 1px solid #2B3B36; border-radius: 6px; padding: 16px; box-sizing: border-box; min-width: 0; border-color: rgba(240,96,122,.45) !important; flex: 1 1 100%"><div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: -16px -16px 14px; padding: 9px 16px; min-height: 44px; box-sizing: border-box; background: #151F1C; border-bottom: 1px solid #2B3B36"><h2 id="sp6" style="margin: 0; font-size: 15px; font-weight: 600; font-family: 'Barlow Semi Condensed', 'Barlow', sans-serif; letter-spacing: 0.01em">Delete account</h2></div><p style="margin: 0; font-size: 14px; color: #CFDAD5">Permanently delete your account and everything in it: trades, notes, tags, rules, and profile. This can’t be undone. Download your data first if you want a copy.</p><div style="margin-top: 14px"><button type="button" onClick="{{delOpen}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid rgba(240,96,122,.6); border-radius: 6px; background: rgba(240,96,122,.08); color: #F7A8B8; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer">Delete my account</button></div><template data-scif value="{{delShow}}" hint-placeholder-val="{{ false }}"><div style="margin-top: 12px; padding: 14px; border-radius: 6px; border: 1px solid rgba(240,96,122,.5); background: rgba(240,96,122,.06)"><p style="margin: 0 0 10px; font-size: 13px; color: #F7C4CE">Your account and all of its data will be deleted right away.</p><label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: #CFDAD5">Type {{delWord}} to confirm<input type="text" value="{{delTyped}}" onChange="{{delSetTyped}}" autocomplete="off" style="width: 100%; box-sizing: border-box; min-height: 42px; padding: 0 12px; border: 1px solid #3A4E47; border-radius: 6px; background: #111A17; color: #EFF5F2; font: inherit; font-size: 14px"></label><div style="display: flex; gap: 8px; margin-top: 10px"><button type="button" onClick="{{delCancel}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid #3A4E47; border-radius: 6px; background: transparent; color: #EFF5F2; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Cancel</button><button type="button" onClick="{{delGo}}" disabled="{{delDisabled}}" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1px solid rgba(240,96,122,.6); border-radius: 6px; background: rgba(240,96,122,.08); color: #F7A8B8; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; opacity: {{delOp}}">Delete my account forever</button></div></div></template><template data-scif value="{{delMsgHas}}" hint-placeholder-val="{{ false }}"><p role="status" style="margin: 10px 0 0; font-size: 13px; color: {{delMsgColor}}">{{delMsg}}</p></template></section>

<script type="application/json" id="dc-props">{"accent":{"editor":"color","default":"#D8B25A","options":["#D8B25A","#D8B25A","#38BDF8"]},"gain":{"editor":"color","default":"#4FD1B5","options":["#4FD1B5","#38BDF8","#9ECE6A"]},"loss":{"editor":"color","default":"#F0607A","options":["#F0607A","#E0AF68","#9ECE6A"]},"$preview":{"width":1440,"height":1500}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    const P = window.TJ_PROFILE || {};
    this.REAL = !!(window.tj && window.TJ_SESSION);
    this.state = { uname: P.username || (this.REAL ? '' : 'thetaflow'), dname: P.display_name || '', unameOk: null, newEmail: '', pw1: '', pw2: '', busy: false, msgs: {}, clearOpen: false, clearTyped: '', delOpen: false, delTyped: '' };
    this._orig = P.username || '';
  }
  say(k, text, err) { const m = Object.assign({}, this.state.msgs); m[k] = { text: text, err: !!err }; this.setState({ msgs: m, busy: false }); }
  demo(k) { this.say(k, 'This is a preview. Sign in on your live site to use this.', true); return !this.REAL; }
  download(name, text, mime) { try { const b = new Blob([text], { type: mime }); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); } catch (e) {} }
  fetchAll() {
    const sb = window.tj;
    return Promise.all([sb.from('profiles').select('*').maybeSingle(), sb.from('trades').select('*').order('opened_at', { ascending: true }).limit(10000), sb.from('fills').select('*').limit(50000), sb.from('rules').select('*'), sb.from('imports').select('*')])
      .then((r) => { const e = r.find((x) => x && x.error); if (e) throw e.error; return { exported_at: new Date().toISOString(), profile: r[0].data, trades: r[1].data || [], fills: r[2].data || [], rules: r[3].data || [], imports: r[4].data || [] }; });
  }
  renderVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A', accent = this.props.accent ?? '#D8B25A';
    const st = this.state, sb = window.tj, REAL = this.REAL;
    const m = (k) => { const x = st.msgs[k]; return { [k]: x ? x.text : '', [k + 'Has']: !!x, [k + 'Color']: x && x.err ? loss : gain }; };
    const stamp = new Date().toISOString().slice(0, 10);
    const delWord = st.uname || 'DELETE';
    const v = Object.assign({ gain, loss, accent, isDemo: !REAL, busy: !!st.busy, uname: st.uname, dname: st.dname, newEmail: st.newEmail, pw1: st.pw1, pw2: st.pw2, delWord: delWord,
      email: (window.TJ_PROFILE && window.TJ_PROFILE.email) || (REAL ? '' : 'you@example.com'),
      unameHint: st.unameOk === false ? '@' + st.uname + ' is taken or not allowed.' : st.unameOk === true ? '@' + st.uname + ' is available.' : '3–20 characters: lowercase letters, numbers, or _',
      unameHintColor: st.unameOk === false ? loss : st.unameOk === true ? gain : '#8A9C95',
      setUname: (ev) => { const val = ev.target.value.toLowerCase().replace(/[^a-z0-9_]/g, '').slice(0, 20); this.setState({ uname: val, unameOk: null }); clearTimeout(this._ut);
        if (REAL && /^[a-z0-9_]{3,20}$/.test(val) && val !== this._orig) this._ut = setTimeout(() => sb.rpc('username_available', { name: val }).then((r) => { if (!r.error && this.state.uname === val) this.setState({ unameOk: !!r.data }); }), 350); },
      setDname: (ev) => this.setState({ dname: ev.target.value.slice(0, 40) }),
      saveProfile: () => { if (this.demo('profMsg')) return; if (!/^[a-z0-9_]{3,20}$/.test(st.uname)) { this.say('profMsg', 'Usernames need 3–20 lowercase letters, numbers, or _.', true); return; }
        this.setState({ busy: true }); const uid = window.TJ_SESSION.user.id, row = { username: st.uname, display_name: st.dname.trim() || null };
        const fail = (e) => this.say('profMsg', e && /duplicate|unique/i.test(e.message || '') ? '@' + st.uname + ' is already taken.' : 'Couldn’t save your profile' + (e && e.message ? ': ' + e.message : '.'), true);
        sb.from('profiles').update(row).eq('id', uid).select('id').then((r) => {
          if (r.error) { fail(r.error); return; }
          const finish = () => { this._orig = st.uname; this.say('profMsg', 'Profile saved. Updating your account menu…'); setTimeout(() => location.reload(), 900); };
          if (r.data && r.data.length) { finish(); return; }
          sb.from('profiles').insert(Object.assign({ id: uid }, row)).select('id').then((r2) => { if (r2.error || !r2.data || !r2.data.length) fail(r2.error || { message: 'your profile couldn’t be created. Run fix-profiles.sql in Supabase.' }); else finish(); }, fail);
        }, fail); },
      setNewEmail: (ev) => this.setState({ newEmail: ev.target.value.trim() }),
      saveEmail: () => { if (this.demo('emailMsg')) return; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(st.newEmail)) { this.say('emailMsg', 'Enter a valid email address.', true); return; }
        this.setState({ busy: true }); const base = location.href.split('?')[0].split('#')[0].replace(/[^/]*$/, '');
        sb.auth.updateUser({ email: st.newEmail }, { emailRedirectTo: base + 'settings.html' }).then((r) => { if (r.error) this.say('emailMsg', r.error.message, true); else { this.setState({ newEmail: '' }); this.say('emailMsg', 'Check your inbox. We sent a confirmation link to finish the change.'); } }); },
      setPw1: (ev) => this.setState({ pw1: ev.target.value }), setPw2: (ev) => this.setState({ pw2: ev.target.value }),
      savePw: () => { if (this.demo('pwMsg')) return; if (st.pw1.length < 8) { this.say('pwMsg', 'Your new password needs at least 8 characters.', true); return; } if (st.pw1 !== st.pw2) { this.say('pwMsg', 'The two passwords don’t match.', true); return; }
        this.setState({ busy: true }); sb.auth.updateUser({ password: st.pw1 }).then((r) => { if (r.error) this.say('pwMsg', r.error.message, true); else { this.setState({ pw1: '', pw2: '' }); this.say('pwMsg', 'Password updated.'); } }); },
      signOutAll: () => { if (this.demo('sessMsg')) return; sb.auth.signOut({ scope: 'global' }).then(() => { location.href = 'index.html'; }, () => this.say('sessMsg', 'Couldn’t sign out everywhere. Please try again.', true)); },
      exportJson: () => { if (this.demo('dataMsg')) return; this.setState({ busy: true }); this.fetchAll().then((d) => { this.download('trade-journal-export-' + stamp + '.json', JSON.stringify(d, null, 2), 'application/json'); this.say('dataMsg', 'Downloaded ' + d.trades.length + ' trades, ' + d.fills.length + ' fills, and ' + d.rules.length + ' rules.'); }, () => this.say('dataMsg', 'Couldn’t download your data. Please try again.', true)); },
      exportCsv: () => { if (this.demo('dataMsg')) return; this.setState({ busy: true }); this.fetchAll().then((d) => {
        const q = (x) => { const s = x == null ? '' : String(x); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
        const cols = ['opened_at', 'closed_at', 'underlying', 'strategy', 'structure', 'quantity', 'entry_price', 'pnl', 'fees', 'status', 'tags', 'note'];
        const lines = [cols.join(',')].concat(d.trades.map((t) => cols.map((c) => q(c === 'tags' ? (t.tags || []).join('; ') : t[c])).join(',')));
        this.download('trade-journal-trades-' + stamp + '.csv', lines.join('\n'), 'text/csv'); this.say('dataMsg', 'Downloaded ' + d.trades.length + ' trades as a CSV.'); }, () => this.say('dataMsg', 'Couldn’t download your trades. Please try again.', true)); },
      clearOpen: () => this.setState({ clearOpen: true, clearTyped: '' }), clearCancel: () => this.setState({ clearOpen: false }), clearTyped: st.clearTyped, clearSetTyped: (ev) => this.setState({ clearTyped: ev.target.value }),
      clearShow: !!st.clearOpen, delShow: !!st.delOpen, clearDisabled: st.clearTyped !== 'DELETE', clearOp: st.clearTyped === 'DELETE' ? 1 : 0.5,
      clearGo: () => { if (st.clearTyped !== 'DELETE') return; if (this.demo('dataMsg')) return; this.setState({ busy: true }); const uid = window.TJ_SESSION.user.id;
        sb.from('fills').delete().eq('user_id', uid).then((a) => { if (a.error) throw a.error; return sb.from('trades').delete().eq('user_id', uid); }).then((b) => { if (b.error) throw b.error; return sb.from('imports').delete().eq('user_id', uid); })
          .then(() => { this.setState({ clearOpen: false, clearTyped: '' }); this.say('dataMsg', 'All your trades were deleted. Import a CSV whenever you’re ready.'); }, () => this.say('dataMsg', 'Couldn’t delete your trades. Please try again.', true)); },
      delOpen: () => this.setState({ delOpen: true, delTyped: '' }), delCancel: () => this.setState({ delOpen: false }), delTyped: st.delTyped, delSetTyped: (ev) => this.setState({ delTyped: ev.target.value }),
      delDisabled: st.delTyped !== delWord, delOp: st.delTyped === delWord ? 1 : 0.5,
      delGo: () => { if (st.delTyped !== delWord) return; if (this.demo('delMsg')) return; this.setState({ busy: true });
        sb.rpc('delete_my_account').then((r) => { if (r.error) { this.say('delMsg', 'Couldn’t delete your account: ' + r.error.message, true); return; } sb.auth.signOut().then(() => { location.href = 'index.html'; }, () => { location.href = 'index.html'; }); }, () => this.say('delMsg', 'Couldn’t delete your account. Please try again.', true)); }
    }, m('profMsg'), m('emailMsg'), m('pwMsg'), m('sessMsg'), m('dataMsg'), m('delMsg'));
    return v;
  }
}
</script>
