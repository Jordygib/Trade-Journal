body{margin:0;background-color:#0C1110;background-image:linear-gradient(rgba(216,178,90,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(216,178,90,0.04) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
.bgfx{position:relative}

.bgfx > *{position:relative;z-index:1}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,2%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main > *{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
main > *:nth-child(1){animation-delay:0.00s}main > *:nth-child(2){animation-delay:0.06s}main > *:nth-child(3){animation-delay:0.12s}main > *:nth-child(4){animation-delay:0.18s}main > *:nth-child(5){animation-delay:0.24s}main > *:nth-child(6){animation-delay:0.30s}main > *:nth-child(7){animation-delay:0.36s}main > *:nth-child(8){animation-delay:0.42s}main > *:nth-child(9){animation-delay:0.48s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .25s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.barU,.barD{transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.barU{transform-origin:50% 100%}.barD{transform-origin:50% 0%}
@keyframes grow{from{transform:scaleY(0)}}
.gx{transform-origin:left center;animation:gx 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
.cal > div{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.cal > div:nth-child(1){animation-delay:0.04s}.cal > div:nth-child(2){animation-delay:0.08s}.cal > div:nth-child(3){animation-delay:0.12s}.cal > div:nth-child(4){animation-delay:0.16s}.cal > div:nth-child(5){animation-delay:0.20s}.cal > div:nth-child(6){animation-delay:0.24s}.cal > div:nth-child(7){animation-delay:0.28s}.cal > div:nth-child(8){animation-delay:0.32s}.cal > div:nth-child(9){animation-delay:0.36s}.cal > div:nth-child(10){animation-delay:0.40s}.cal > div:nth-child(11){animation-delay:0.44s}.cal > div:nth-child(12){animation-delay:0.48s}.cal > div:nth-child(13){animation-delay:0.52s}.cal > div:nth-child(14){animation-delay:0.56s}.cal > div:nth-child(15){animation-delay:0.60s}
main section{transition:border-color .2s ease}

.kpi:hover::before{width:100%}

.pulse{position:relative;flex:none;width:7px;height:7px;border-radius:50%;background:#4FD1B5}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(79,209,181,.6);animation:ping 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 7px rgba(79,209,181,0)}}

        if (C.per > 1) { const mins = 9 * 60 + 30 + k * C.step; const hh = Math.floor(mins / 60), mm = mins % 60; time = (((hh + 11) % 12) + 1) + ':' + String(mm).padStart(2, '0'); }
        bars.push({ o: o, h: h, l: l, c: c, v: v, day: di, dayLabel: MON[dl[di].getMonth()] + ' ' + dl[di].getDate(), time: time });
        p = c;
      }
    }
    if (C.per === 1) { const k = 5790 / bars[bars.length - 1].c; bars.forEach((x) => { x.o *= k; x.h *= k; x.l *= k; x.c *= k; }); }
    const n = bars.length, cl = bars.map((b) => b.c);
    const sma = new Array(n).fill(null), bbU = new Array(n).fill(null), bbL = new Array(n).fill(null);
    for (let i = 19; i < n; i++) {
      let s = 0; for (let j = i - 19; j <= i; j++) s += cl[j];
      const m = s / 20; let q = 0; for (let j = i - 19; j <= i; j++) q += (cl[j] - m) * (cl[j] - m);
      const sd = Math.sqrt(q / 20); sma[i] = m; bbU[i] = m + 2 * sd; bbL[i] = m - 2 * sd;
    }
    const ema50 = this.ema(cl, 50);
    const e12 = this.ema(cl, 12), e26 = this.ema(cl, 26);
    const macd = cl.map((_, i) => (e12[i] != null && e26[i] != null) ? e12[i] - e26[i] : null);
    const signal = this.ema(macd, 9);
    const hist = macd.map((v, i) => (v != null && signal[i] != null) ? v - signal[i] : null);
    const rsi = new Array(n).fill(null);
    let g = 0, ls = 0;
    for (let i = 1; i < n; i++) {
      const d = cl[i] - cl[i - 1]; const up = Math.max(d, 0), dn = Math.max(-d, 0);
      if (i <= 14) { g += up; ls += dn; if (i === 14) { g /= 14; ls /= 14; rsi[i] = ls === 0 ? 100 : 100 - 100 / (1 + g / ls); } }
      else { g = (g * 13 + up) / 14; ls = (ls * 13 + dn) / 14; rsi[i] = ls === 0 ? 100 : 100 - 100 / (1 + g / ls); }
    }
    const vwap = new Array(n).fill(null);
    let pv = 0, vv = 0, lastDay = -1;
    for (let i = 0; i < n; i++) {
      const b = bars[i];
      if (C.per > 1 && b.day !== lastDay) { pv = 0; vv = 0; lastDay = b.day; }
      pv += (b.h + b.l + b.c) / 3 * b.v; vv += b.v; vwap[i] = pv / vv;
    }
    const out = { bars: bars, sma: sma, bbU: bbU, bbL: bbL, ema50: ema50, macd: macd, signal: signal, hist: hist, rsi: rsi, vwap: vwap };
    this._cache[tf] = out;
    return out;
  }
  win() {
    const n = this.series(this.state.tf).bars.length;
    let s = this.state.start, e = this.state.end;
    if (s == null || e == null) { s = 0; e = n - 1; }
    const m = Math.max(12, Math.min(n, e - s + 1));
    s = Math.max(0, Math.min(s, n - m));
    return { s: s, e: s + m - 1 };
  }
  frac(clientX) {
    if (!this._el) return 0.5;
    const r = this._el.getBoundingClientRect();
    const g = this._geo || { VW: 1000, PW: 930 };
    return Math.min(1, Math.max(0, ((clientX - r.left) / r.width * g.VW) / g.PW));
  }
  zoomAt(f, frac) {
    const n = this.series(this.state.tf).bars.length;
    const w = this.win(); const m = w.e - w.s + 1;
    let nm = Math.round(m * f);
    if (nm === m) nm = f < 1 ? m - 1 : m + 1;
    nm = Math.max(12, Math.min(n, nm));
    const anchor = w.s + frac * m;
    let ns = Math.round(anchor - frac * nm);
    ns = Math.max(0, Math.min(ns, n - nm));
    this.setState({ start: ns, end: ns + nm - 1 });
  }
  renderVals() {
    const gain = this.props.gain ?? '#4FD1B5', loss = this.props.loss ?? '#F0607A', accent = this.props.accent ?? '#D8B25A';
    const st = this.state, ind = st.ind;
    const S = this.series(st.tf), bars = S.bars, n = bars.length;
    const w = this.win(), s = w.s, e = w.e, m = e - s + 1;
    const VW = st.narrow ? 560 : 1000, PW = VW - 70, bw = PW / m;
    const X = (i) => (i - s + 0.5) * bw;
    const f1 = (v) => v.toFixed(1);
    const fmt = (v) => v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    let hi = -Infinity, lo = Infinity;
    for (let i = s; i <= e; i++) {
      hi = Math.max(hi, bars[i].h); lo = Math.min(lo, bars[i].l);
      if (ind.bb && S.bbU[i] != null) { hi = Math.max(hi, S.bbU[i]); lo = Math.min(lo, S.bbL[i]); }
    }
    const strikesOn = ind.strikes && st.tf === '1D';
    const base = bars[0].o;
    if (strikesOn) { hi = Math.max(hi, base * 1.0112); lo = Math.min(lo, base * 0.993); }
    const pad = (hi - lo) * 0.07; hi += pad; lo -= pad;
    const MT = 10, MH = 300;
    const Y = (p) => MT + (hi - p) / (hi - lo) * MH;
    let y0 = MT + MH + 14;
    const paneLabels = [];
    let rsiTop = null, macdTop = null;
    if (ind.rsi) { rsiTop = y0 + 18; paneLabels.push({ text: 'RSI 14', y: y0 + 2, color: '#C792EA' }); y0 += 18 + 76 + 10; }
    if (ind.macd) { macdTop = y0 + 18; paneLabels.push({ text: 'MACD 12, 26, 9', y: y0 + 2, color: '#7AA2F7' }); y0 += 18 + 76 + 10; }
    const H = Math.round(y0 + 22);
    this._geo = { s: s, e: e, n: n, bw: bw, H: H, hi: hi, lo: lo, MT: MT, MH: MH, VW: VW, PW: PW };
    let wickUp = '', wickDn = '', bodyUp = '', bodyDn = '', volUp = '', volDn = '';
    let vmax = 0; for (let i = s; i <= e; i++) vmax = Math.max(vmax, bars[i].v);
    const bodyW = Math.max(1, bw * 0.64);
    const rect = (x, y, wd, ht) => 'M' + f1(x) + ' ' + f1(y) + 'h' + f1(wd) + 'v' + f1(ht) + 'h' + f1(-wd) + 'Z';
    for (let i = s; i <= e; i++) {
      const b = bars[i], cx = X(i), up = b.c >= b.o;
      const wk = 'M' + f1(cx) + ' ' + f1(Y(b.h)) + 'V' + f1(Y(b.l));
      const yt = Y(Math.max(b.o, b.c)), hh = Math.max(1, Y(Math.min(b.o, b.c)) - yt);
      const bd = rect(cx - bodyW / 2, yt, bodyW, hh);
      if (up) { wickUp += wk; bodyUp += bd; } else { wickDn += wk; bodyDn += bd; }
      if (ind.vol) { const vh = b.v / vmax * 64; const vd = rect(cx - bodyW / 2, MT + MH - vh, bodyW, vh); if (up) volUp += vd; else volDn += vd; }
    }
    const line = (arr, yf) => { let d = '', pen = false; for (let i = s; i <= e; i++) { const v = arr[i]; if (v == null) { pen = false; continue; } d += (pen ? 'L' : 'M') + f1(X(i)) + ' ' + f1(yf(v)); pen = true; } return d; };
    let bbFill = '';
    if (ind.bb) {
      const idx = []; for (let i = s; i <= e; i++) if (S.bbU[i] != null) idx.push(i);
      if (idx.length > 1) {
        bbFill = 'M' + idx.map((i) => f1(X(i)) + ' ' + f1(Y(S.bbU[i]))).join('L') + 'L' + idx.slice().reverse().map((i) => f1(X(i)) + ' ' + f1(Y(S.bbL[i]))).join('L') + 'Z';
      }
    }
    let grid = '';
    const raw = (hi - lo) / 5, mag = Math.pow(10, Math.floor(Math.log10(raw))), norm = raw / mag;
    const step = (norm < 1.5 ? 1 : norm < 3 ? 2 : norm < 7 ? 5 : 10) * mag;
    const yl = [];
    for (let p = Math.ceil(lo / step) * step; p <= hi; p += step) {
      const y = Y(p); if (y < MT + 6 || y > MT + MH - 4) continue;
      grid += 'M0 ' + f1(y) + 'H' + PW;
      yl.push({ top: (y / H * 100).toFixed(2), text: p.toLocaleString('en-US', { maximumFractionDigits: step < 1 ? 2 : 0 }) });
    }
    let guides = '', rsi = '', macd = '', signal = '', histUp = '', histDn = '';
    if (rsiTop != null) {
      const RY = (v) => rsiTop + (100 - v) / 100 * 76;
      guides += 'M0 ' + f1(RY(70)) + 'H' + PW + 'M0 ' + f1(RY(30)) + 'H' + PW;
      grid += 'M0 ' + f1(rsiTop - 18) + 'H' + PW;
      rsi = line(S.rsi, RY);
    }
    if (macdTop != null) {
      let mx = 1e-9;
      for (let i = s; i <= e; i++) { [S.macd[i], S.signal[i], S.hist[i]].forEach((v) => { if (v != null) mx = Math.max(mx, Math.abs(v)); }); }
      const MY = (v) => macdTop + 38 - v / mx * 36;
      guides += 'M0 ' + f1(MY(0)) + 'H' + PW;
      grid += 'M0 ' + f1(macdTop - 18) + 'H' + PW;
      for (let i = s; i <= e; i++) {
        const hv = S.hist[i]; if (hv == null) continue;
        const y1 = MY(Math.max(hv, 0)), y2 = MY(Math.min(hv, 0));
        const d = rect(X(i) - bodyW / 2, y1, bodyW, Math.max(0.8, y2 - y1));
        if (hv >= 0) histUp += d; else histDn += d;
      }
      macd = line(S.macd, MY); signal = line(S.signal, MY);
    }
    let bands = '';
    if (strikesOn) {
      bands = rect(0, Y(base * 1.0112), PW, Y(base * 1.0096) - Y(base * 1.0112)) + rect(0, Y(base * 0.9946), PW, Y(base * 0.993) - Y(base * 0.9946));
      paneLabels.push({ text: 'Verified call strikes', y: Y(base * 1.0112) + 2, color: '#D9B8F5' });
      paneLabels.push({ text: 'Verified put strikes', y: Y(base * 0.9946) + 2, color: '#D9B8F5' });
    }
    const tags = [];
    let hl = '';
    st.hlines.forEach((p) => { if (p > lo && p < hi) { const y = Y(p); hl += 'M0 ' + f1(y) + 'H' + PW; tags.push({ top: (y / H * 100).toFixed(2), text: fmt(p), bg: '#9ECE6A', fg: '#0C1110' }); } });
    const last = bars[e];
    tags.push({ top: (Y(last.c) / H * 100).toFixed(2), text: fmt(last.c), bg: last.c >= last.o ? gain : loss, fg: '#0C1110' });
    let cross = '';
    const hv = st.hover;
    let hi_ = e;
    if (hv) {
      hi_ = Math.max(s, Math.min(e, hv.i));
      cross = 'M' + f1(X(hi_)) + ' ' + MT + 'V' + (H - 22);
      if (hv.y >= MT && hv.y <= MT + MH) {
        cross += 'M0 ' + f1(hv.y) + 'H' + PW;
        tags.push({ top: (hv.y / H * 100).toFixed(2), text: fmt(hi - (hv.y - MT) / MH * (hi - lo)), bg: '#2E3F3A', fg: '#FFFFFF' });
      }
    }
    const b = bars[hi_];
    const prev = hi_ > 0 ? bars[hi_ - 1].c : b.o;
    const pct = (b.c - prev) / prev * 100;
    const legend = [];
    const fv = (v, d) => v == null ? '—' : (d === 1 ? v.toFixed(1) : d === 2 ? v.toFixed(2) : fmt(v));
    if (ind.vol) legend.push({ label: 'Vol', value: b.v >= 1e6 ? (b.v / 1e6).toFixed(2) + 'M' : Math.round(b.v / 1e3) + 'K', color: '#8DA098' });
    if (ind.vwap) legend.push({ label: 'VWAP', value: fv(S.vwap[hi_]), color: accent });
    if (ind.sma) legend.push({ label: 'SMA 20', value: fv(S.sma[hi_]), color: '#E0AF68' });
    if (ind.ema) legend.push({ label: 'EMA 50', value: fv(S.ema50[hi_]), color: '#7AA2F7' });
    if (ind.bb) legend.push({ label: 'BB', value: fv(S.bbU[hi_]) + ' / ' + fv(S.bbL[hi_]), color: '#C792EA' });
    if (ind.rsi) legend.push({ label: 'RSI', value: fv(S.rsi[hi_], 1), color: '#C792EA' });
    if (ind.macd) legend.push({ label: 'MACD', value: fv(S.macd[hi_], 2) + ' / ' + fv(S.signal[hi_], 2), color: '#7AA2F7' });
    const xl = [];
    const cnt = Math.min(st.narrow ? 4 : 6, m);
    for (let k = 0; k < cnt; k++) {
      const i = s + Math.round(k * (m - 1) / Math.max(1, cnt - 1));
      const bb = bars[i];
      let text = st.tf === '1D' ? bb.time : (st.tf === '5D' || st.tf === '1M') ? (m < 40 ? bb.dayLabel + ' ' + bb.time : bb.dayLabel) : bb.dayLabel;
      xl.push({ left: Math.min(86, Math.max(6, X(i) / VW * 100)).toFixed(2), top: ((H - 18) / H * 100).toFixed(2), text: text });
    }
    const onBtn = (on) => ({ bg: 'transparent', fg: on ? '#FFFFFF' : '#8DA098', ac: on ? accent : 'transparent' });
    const tfs = ['1D', '5D', '1M', '6M', '1Y'].map((t) => Object.assign({ label: t, on: st.tf === t, pick: () => this.setState({ tf: t, start: null, end: null, hover: null }) }, onBtn(st.tf === t)));
    const tools = [['cross', 'Crosshair'], ['hline', 'Horizontal line']].map((t) => Object.assign({ label: t[1], on: st.tool === t[0], pick: () => this.setState({ tool: t[0] }) }, onBtn(st.tool === t[0])));
    const defs = [['vol', 'Volume', '#8DA098'], ['vwap', 'VWAP', accent], ['sma', 'SMA 20', '#E0AF68'], ['ema', 'EMA 50', '#7AA2F7'], ['bb', 'Bollinger 20, 2', '#C792EA'], ['rsi', 'RSI 14', '#C792EA'], ['macd', 'MACD', '#7AA2F7'], ['strikes', 'Verified strikes (1D)', '#D9B8F5']];
    const inds = defs.map((d) => {
      const on = !!ind[d[0]];
      return { label: d[1], color: d[2], on: on, bd: on ? d[2] : '#2E3F3A', bg: on ? 'color-mix(in srgb, ' + d[2] + ' 16%, transparent)' : 'transparent', fg: on ? '#E4ECE8' : '#8DA098',
        pick: () => { const ni = Object.assign({}, this.state.ind); ni[d[0]] = !ni[d[0]]; this.setState({ ind: ni }); } };
    });
    return {
      gain, loss, accent, H, VW, tfs, tools, inds, grid, bands, bbFill,
      bbU: ind.bb ? line(S.bbU, Y) : '', bbL: ind.bb ? line(S.bbL, Y) : '',
      volUp, volDn, wickUp, wickDn, bodyUp, bodyDn,
      sma: ind.sma ? line(S.sma, Y) : '', ema: ind.ema ? line(S.ema50, Y) : '', vwap: ind.vwap ? line(S.vwap, Y) : '',
      hl, guides, rsi, macd, signal, histUp, histDn, cross, tags, yl, xl, legend,
      paneLabels: paneLabels.map((p) => ({ text: p.text, color: p.color, top: (p.y / H * 100).toFixed(2) })),
      tfLabel: st.tf, when: b.dayLabel + (b.time ? ' ' + b.time : ''),
      O: fmt(b.o), Hh: fmt(b.h), L: fmt(b.l), C: fmt(b.c),
      chg: (pct >= 0 ? '+' : '−') + Math.abs(pct).toFixed(2) + '%', barColor: b.c >= b.o ? gain : loss,
      cursor: st.tool === 'hline' ? 'copy' : 'crosshair',
      aria: 'SPX ' + st.tf + ' candlestick chart with sample data, showing ' + m + ' bars',
      setRef: this.setRef,
      zoomIn: () => this.zoomAt(0.7, 1), zoomOut: () => this.zoomAt(1.4, 1),
      resetView: () => this.setState({ start: null, end: null }),
      clearLines: () => this.setState({ hlines: [] }),
      onDown: (ev) => {
        if (ev.button != null && ev.button !== 0) return;
        try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (err) {}
        this._pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
        const ids = Object.keys(this._pts);
        if (ids.length === 2) {
          const a = this._pts[ids[0]], b = this._pts[ids[1]];

          this._drag = null;
          return;
        }
        const ww = this.win();
        this._drag = { x: ev.clientX, s: ww.s, e: ww.e, moved: false };
      },
      onMove: (ev) => {
        const g = this._geo; if (!g || !this._el) return;
        const r = this._el.getBoundingClientRect();
        if (this._pts[ev.pointerId]) this._pts[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
        const ids = Object.keys(this._pts);
        if (this._pinch && ids.length >= 2) {
          const a = this._pts[ids[0]], b = this._pts[ids[1]];
          const d = Math.max(10, Math.hypot(a.x - b.x, a.y - b.y));

          let nm = Math.round(m0 * this._pinch.d0 / d);

          let ns = Math.round(w0.s + mid * m0 - mid * nm);
          ns = Math.max(0, Math.min(ns, g.n - nm));

          return;
        }
        if (this._drag) {
          const dx = ev.clientX - this._drag.x;
          if (Math.abs(dx) > 4) this._drag.moved = true;
          if (this._drag.moved) {
            const mm = this._drag.e - this._drag.s + 1;
            let ns = Math.round(this._drag.s - dx * mm / (r.width * g.PW / g.VW));
            ns = Math.max(0, Math.min(ns, g.n - mm));
            this.setState({ start: ns, end: ns + mm - 1, hover: null });
            return;
          }
        }
        const sx = (ev.clientX - r.left) / r.width * g.VW;
        const sy = (ev.clientY - r.top) / r.height * g.H;
        if (sx > g.PW) { if (this.state.hover) this.setState({ hover: null }); return; }
        const i = Math.max(g.s, Math.min(g.e, g.s + Math.floor(sx / g.bw)));
        this.setState({ hover: { i: i, y: sy } });
      },
      onUp: (ev) => {
        const wasPinch = !!this._pinch;
        delete this._pts[ev.pointerId];
        if (Object.keys(this._pts).length < 2) this._pinch = null;
        const d = this._drag; this._drag = null;
        if (!wasPinch && d && !d.moved && this.state.tool === 'hline' && this._el && this._geo) {
          const g = this._geo; const r = this._el.getBoundingClientRect();
          const sy = (ev.clientY - r.top) / r.height * g.H;
          if (sy >= g.MT && sy <= g.MT + g.MH) {
            const price = g.hi - (sy - g.MT) / g.MH * (g.hi - g.lo);
            this.setState({ hlines: this.state.hlines.concat([price]).slice(-8) });
          }
        }
      },
      onLeave: (ev) => { if (ev && ev.pointerId != null) delete this._pts[ev.pointerId]; if (Object.keys(this._pts).length < 2) this._pinch = null; this._drag = null; if (this.state.hover) this.setState({ hover: null }); }
    };
  }
}
