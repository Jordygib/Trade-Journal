me": "Backspread", "color": "#C792EA", "count": 0}]}, {"name": "Stock and options", "items": [{"k": "cc", "name": "Covered call", "color": "#E0AF68", "count": 0}, {"k": "csp", "name": "Cash-secured put", "color": "#9ECE6A", "count": 0}, {"k": "collar", "name": "Collar", "color": "#F7A8C0", "count": 0}]}, {"name": "Other", "items": [{"k": "other", "name": "Other", "color": "#A2B4AC", "count": 0}]}];
    CAT.forEach((g) => g.items.forEach((o) => { colors[o.k] = o.color; names[o.k] = o.name; if (REAL) o.count = DATA.filter((t) => t.k === o.k).length; }));
    const st = this.state;

      AAPL: 'Apple', MSFT: 'Microsoft', NVDA: 'NVIDIA', AMZN: 'Amazon', GOOGL: 'Alphabet (Google)', GOOG: 'Alphabet (Google)', META: 'Meta Platforms', TSLA: 'Tesla', AMD: 'Advanced Micro Devices', NFLX: 'Netflix', AVGO: 'Broadcom', INTC: 'Intel', COIN: 'Coinbase', PLTR: 'Palantir', SOFI: 'SoFi Technologies', UBER: 'Uber Technologies', WMT: 'Walmart', JPM: 'JPMorgan Chase', BAC: 'Bank of America', DIS: 'Disney', BA: 'Boeing', COST: 'Costco', KO: 'Coca-Cola', PEP: 'PepsiCo', XOM: 'Exxon Mobil', CVX: 'Chevron', HOOD: 'Robinhood', SMCI: 'Super Micro Computer', MU: 'Micron', ORCL: 'Oracle', CRM: 'Salesforce', SHOP: 'Shopify', SNOW: 'Snowflake', PYPL: 'PayPal', SQ: 'Block', XYZ: 'Block', MSTR: 'MicroStrategy', GLD: 'SPDR Gold Shares', SLV: 'iShares Silver Trust', TLT: '20+ Year Treasury ETF', XLE: 'Energy Select Sector ETF', XLF: 'Financial Select Sector ETF', ARKK: 'ARK Innovation ETF' };
    const tagColor = (k) => k === 'gain' ? gain : (k === 'loss' ? loss : accent);
    const GOOD = ['followed plan', 'a+ setup', 'managed early', 'patient entry', 'good exit'], BAD = ['fomo', 'revenge', 'broke a rule', 'size creep', 'early entry', 'chased', 'news day', 'overtraded'];
    const tone = (t) => { const x = String(t).toLowerCase(); return GOOD.indexOf(x) >= 0 ? 'gain' : BAD.indexOf(x) >= 0 ? 'loss' : 'accent'; };
    const SUGG = ['Followed plan', 'A+ setup', 'Managed early', 'FOMO', 'Revenge', 'Broke a rule', 'Size creep', 'Early entry', 'News day', 'Chased'];
    const ed = st.editing;
    const curNote = (t) => (st.edits[t.id] && st.edits[t.id].note != null ? st.edits[t.id].note : (t.note === 'No note yet.' ? '' : t.note || ''));
    const curTags = (t) => (st.edits[t.id] && st.edits[t.id].tags ? st.edits[t.id].tags : (t.tags || []).map((g) => g[0]));
    const list = DATA.filter((t) => (st.result === 'all' || (st.result === 'win' ? t.pnl > 0 : t.pnl < 0)) && (st.sel.length === 0 || st.sel.indexOf(t.k) >= 0));
    const rows = list.map((t) => {
      const open = !!st.open[t.id];
      return Object.assign({}, t, {
        color: colors[t.k], name: names[t.k], nameLower: names[t.k].toLowerCase(), open: open,
        chev: open ? 'rotate(180deg)' : 'none', detailLabel: open ? 'Hide details' : 'Show fills and note', rowBg: open ? '#1C2824' : 'transparent',
        pnlText: (t.pnl > 0 ? '+$' : '−$') + Math.abs(t.pnl).toLocaleString('en-US'),
        pnlColor: t.pnl > 0 ? gain : loss,
        sym: t.sym || 'SPX', company: COMPANY[t.sym || 'SPX'] || (t.sym || 'SPX'),
        tags: curTags(t).map((g) => ({ text: g, color: tagColor(tone(g)), bg: 'color-mix(in srgb, ' + tagColor(tone(g)) + ' 15%, transparent)' })),
        noteText: curNote(t) || 'No note yet. Add one to remember why you took this trade.', noteColor: curNote(t) ? '#CFDAD5' : '#8A9C95', noteMeta: (st.edits[t.id] && st.edits[t.id].savedAt) ? 'Saved' : '',
        showNote: !(ed && ed.id === t.id && ed.mode === 'note'), editNote: !!(ed && ed.id === t.id && ed.mode === 'note'), editTags: !!(ed && ed.id === t.id && ed.mode === 'tags'),
        noteBtn: curNote(t) ? 'Edit note' : 'Add note', tagBtn: curTags(t).length ? 'Edit tags' : 'Add tags',
        startNote: () => this.setState({ editing: { id: t.id, dbid: t.dbid, mode: 'note' }, draft: curNote(t), msg: null }),
        startTags: () => this.setState({ editing: { id: t.id, dbid: t.dbid, mode: 'tags' }, tags: curTags(t).slice(), tagInput: '', msg: null }),
        hasMsg: !!(st.msg && st.msg.id === t.id), msg: st.msg && st.msg.id === t.id ? st.msg.text : '', msgColor: st.msg && st.msg.err ? loss : gain,
        toggle: () => { const o = Object.assign({}, this.state.open); o[t.id] = !o[t.id]; this.setState({ open: o }); }
      });
    });
    const addTag = (raw) => { const v = String(raw || '').trim().replace(/\s+/g, ' ').slice(0, 24); if (!v) return; const cur = this.state.tags; if (cur.some((x) => x.toLowerCase() === v.toLowerCase()) || cur.length >= 8) { this.setState({ tagInput: '' }); return; } this.setState({ tags: cur.concat([v]), tagInput: '' }); };
    const saveEdit = () => {
      const e2 = this.state.editing; if (!e2) return;
      const patch = e2.mode === 'note' ? { note: this.state.draft.trim() } : { tags: this.state.tags.slice() };
      const done = (err) => { if (err) { this.setState({ saving: false, msg: { id: e2.id, err: true, text: 'Couldn’t save. Check your connection and try again.' } }); return; }
        const ed2 = Object.assign({}, this.state.edits); ed2[e2.id] = Object.assign({}, ed2[e2.id] || {}, patch, { savedAt: Date.now() });
        this.setState({ edits: ed2, editing: null, saving: false, msg: { id: e2.id, err: false, text: e2.mode === 'note' ? 'Note saved.' : 'Tags saved.' } }); };
      if (REAL && window.tj && e2.dbid) { this.setState({ saving: true }); window.tj.from('trades').update(e2.mode === 'note' ? { note: patch.note || null } : { tags: patch.tags }).eq('id', e2.dbid).then((r) => done(r && r.error), () => done(true)); }
      else done(false);
    };
    const editTagsSt = st.tags || [];
    const tagChips = editTagsSt.map((g) => ({ text: g, color: tagColor(tone(g)), bg: 'color-mix(in srgb, ' + tagColor(tone(g)) + ' 15%, transparent)', removeLabel: 'Remove tag ' + g, remove: () => this.setState({ tags: this.state.tags.filter((x) => x !== g) }) }));
    const tagSugg = SUGG.filter((g) => !editTagsSt.some((x) => x.toLowerCase() === g.toLowerCase())).map((g) => ({ text: g, add: () => addTag(g) }));
    const editVals = { draft: st.draft, setDraft: (ev) => this.setState({ draft: ev.target.value }), draftCount: (st.draft || '').length + ' / 2000', cancelEdit: () => this.setState({ editing: null, msg: null }), saveEdit: saveEdit, saving: !!st.saving, saveLabel: st.saving ? 'Saving…' : 'Save',
      tagChips, noTags: !tagChips.length, tagSugg, tagInput: st.tagInput, setTagInput: (ev) => this.setState({ tagInput: ev.target.value }), tagKey: (ev) => { if (ev.key === 'Enter' || ev.key === ',') { ev.preventDefault(); addTag(this.state.tagInput); } }, addTagBtn: () => addTag(this.state.tagInput) };
    const net = list.reduce((a, t) => a + t.pnl, 0);
    const wins = list.filter((t) => t.pnl > 0).length;
    const results = [['all', 'All'], ['win', 'Winners'], ['loss', 'Losers']].map((r) => ({ label: r[1], on: st.result === r[0], bg: 'transparent', ac: st.result === r[0] ? accent : 'transparent', fg: st.result === r[0] ? '#FFFFFF' : '#A2B4AC', pick: () => this.setState({ result: r[0] }) }));
    
    const byK = {}; CAT.forEach((g) => g.items.forEach((o) => { byK[o.k] = o; }));
    const toggleK = (k) => { const cur = this.state.sel; this.setState({ sel: cur.indexOf(k) >= 0 ? cur.filter((x) => x !== k) : cur.concat([k]) }); };
    const q = st.ddQuery.trim().toLowerCase();
    const ddGroups = CAT.map((g) => ({ name: g.name, items: g.items.filter((o) => !q || o.name.toLowerCase().indexOf(q) >= 0 || g.name.toLowerCase().indexOf(q) >= 0).map((o) => {
      const on = st.sel.indexOf(o.k) >= 0;
      return { name: o.name, color: o.color, on: on, fg: o.count ? '#EFF5F2' : '#B8C6C0', countText: o.count ? o.count + (o.count === 1 ? ' trade' : ' trades') : 'none yet', countColor: o.count ? '#CFDAD5' : '#6B7C75', toggle: () => toggleK(o.k) };
    }) })).filter((g) => g.items.length);
    const selChips = st.sel.map((k) => ({ name: byK[k].name, color: byK[k].color, remove: () => toggleK(k) }));
    const ddLabel = st.sel.length === 0 ? 'All' : (st.sel.length === 1 ? byK[st.sel[0]].name : st.sel.length + ' selected');
    return { ...editVals, gain, loss, accent, rows, results, count: list.length, isSample: !REAL,
      ddOpen: st.ddOpen, ddQuery: st.ddQuery, ddGroups, ddEmpty: ddGroups.length === 0, selChips, ddLabel,
      ddBd: st.ddOpen || st.sel.length ? '#D8B25A' : '#3A4E47', ddChev: st.ddOpen ? 'rotate(180deg)' : 'none',
      ddFoot: st.sel.length ? st.sel.length + ' selected · ' + list.length + ' trades match' : 'Showing every strategy',

      net: (net >= 0 ? '+$' : '−$') + Math.abs(net).toLocaleString('en-US'), netColor: net >= 0 ? gain : loss,
