<style>
body{margin:0;background-color:#0C1110;background-image:linear-gradient(rgba(216,178,90,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(216,178,90,0.04) 1px,transparent 1px);background-size:32px 32px;background-attachment:fixed}
.bgfx{position:relative}
.bgfx::before{content:"";position:fixed;inset:-10%;pointer-events:none;z-index:0;background:radial-gradient(520px 360px at 82% 4%,rgba(79,209,181,0.10),transparent 70%),radial-gradient(480px 340px at 8% 38%,rgba(216,178,90,0.08),transparent 70%),radial-gradient(420px 300px at 60% 95%,rgba(122,162,247,0.06),transparent 70%);animation:drift 26s ease-in-out infinite alternate}
.bgfx > *{position:relative;z-index:1}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,2%,0)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main > *{animation:rise .55s cubic-bezier(.2,.7,.2,1) both}
main > *:nth-child(1){animation-delay:0.00s}main > *:nth-child(2){animation-delay:0.06s}main > *:nth-child(3){animation-delay:0.12s}main > *:nth-child(4){animation-delay:0.18s}main > *:nth-child(5){animation-delay:0.24s}main > *:nth-child(6){animation-delay:0.30s}main > *:nth-child(7){animation-delay:0.36s}main > *:nth-child(8){animation-delay:0.42s}main > *:nth-child(9){animation-delay:0.48s}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s .25s cubic-bezier(.3,.6,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.barU,.barD{transform-box:fill-box;animation:grow .7s cubic-bezier(.2,.7,.2,1) both}
.barU{transform-origin:50% 100%}.barD{transform-origin:50% 0%}
@keyframes grow{from{transform:scaleY(0)}}
.gx{transform-origin:left center;animation:gx 1s .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes gx{from{transform:scaleX(0)}}
.cal > div{animation:pop .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6)}}
.cal > div:nth-child(1){animation-delay:0.04s}.cal > div:nth-child(2){animation-delay:0.08s}.cal > div:nth-child(3){animation-delay:0.12s}.cal > div:nth-child(4){animation-delay:0.16s}.cal > div:nth-child(5){animation-delay:0.20s}.cal > div:nth-child(6){animation-delay:0.24s}.cal > div:nth-child(7){animation-delay:0.28s}.cal > div:nth-child(8){animation-delay:0.32s}.cal > div:nth-child(9){animation-delay:0.36s}.cal > div:nth-child(10){animation-delay:0.40s}.cal > div:nth-child(11){animation-delay:0.44s}.cal > div:nth-child(12){animation-delay:0.48s}.cal > div:nth-child(13){animation-delay:0.52s}.cal > div:nth-child(14){animation-delay:0.56s}.cal > div:nth-child(15){animation-delay:0.60s}
main section{transition:border-color .2s ease}
main section:hover{border-color:#3A4F49 !important}
.kpi{position:relative;transition:background-color .2s ease}
.kpi:hover{background:#16201D !important}
.kpi::before{content:"";position:absolute;left:0;top:0;height:2px;width:0;background:#D8B25A;transition:width .35s ease}
.kpi:hover::before{width:100%}
.trow{transition:background-color .15s ease}
.trow:hover{background:#16201D !important}
button,a{transition:filter .15s ease,background-color .15s ease,color .15s ease,box-shadow .15s ease}
button:hover{filter:brightness(1.15)}
button:active{transform:translateY(1px)}
.tape a:hover{background:#121A18}
.hdr-wrap{position:relative}
.hdr-wrap::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,#D8B25A,transparent);background-size:35% 100%;background-repeat:no-repeat;animation:sheen 7s linear infinite}
@keyframes sheen{from{background-position:-40% 0}to{background-position:140% 0}}
.pulse{position:relative;flex:none;width:7px;height:7px;border-radius:50%;background:#4FD1B5}
.pulse::after{content:"";position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 0 rgba(79,209,181,.6);animation:ping 2s ease-out infinite}
@keyframes ping{to{box-shadow:0 0 0 7px rgba(79,209,181,0)}}
.gold{box-shadow:inset 0 0 0 1px rgba(216,178,90,.45)}
.gold::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(110deg,transparent 30%,rgba(216,178,90,.12) 50%,transparent 70%);background-size:250% 100%;animation:shine 4.5s ease-in-out infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none !important;transition:none !important}.draw{stroke-dashoffset:0}}
a{color:#BFCCC6}a:hover{color:#FFFFFF}
h1,h2{font-family:'Barlow Semi Condensed','Barlow',sans-serif}
@keyframes tape{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tape{animation:tape 60s linear infinite}
.tape:hover{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){.tape{animation:none}}
.hdr-wrap{z-index:5 !important}
.pmenu summary{list-style:none}
.pmenu summary::-webkit-details-marker{display:none}
.pmenu[open] summary{border-color:#D8B25A !important}
.pmenu[open] .pchev{transform:rotate(180deg)}
.pmenu .pitem:hover{background:#16201D !important;color:#FFFFFF !important}
.acct{border-color:rgba(216,178,90,.6) !important;background:linear-gradient(135deg,rgba(216,178,90,.20),rgba(18,26,24,.94) 62%) !important;box-shadow:0 0 0 1px rgba(216,178,90,.25),0 0 18px rgba(216,178,90,.20);animation:acctGlow 3.2s ease-in-out infinite;transition:transform .15s ease}
.acct:hover{transform:translateY(-1px)}

.acct-name{color:#F7DC92 !important}
.me-card{box-shadow:0 0 0 1px rgba(216,178,90,.45),0 0 32px rgba(216,178,90,.14) !important;border-color:color-mix(in srgb,#D8B25A 45%,#22302C) !important;background:radial-gradient(90% 120% at 0% 0%,rgba(216,178,90,.14),rgba(18,26,24,.92) 55%) !important}
@media (max-width: 760px){
.hdr{display:grid !important;grid-template-columns:minmax(0,1fr) auto;padding:0 12px !important;column-gap:8px}
.hdr-left{display:contents !important}

.hdr-actions{grid-column:2;grid-row:1}
.hdr-nav{grid-column:1/-1;grid-row:2;margin:0 -12px;padding:0 4px;-webkit-mask-image:linear-gradient(90deg,#000 82%,transparent);mask-image:linear-gradient(90deg,#000 82%,transparent)}
.hdr-nav a{min-height:44px !important;padding:0 11px !important;font-size:14px !important}
.hide-sm{display:none !important}
.show-sm{display:flex !important}
.show-sm-block{display:block !important}
.pg{padding:14px 12px 32px !important;gap:12px !important}
.pg-top{padding:16px 12px 0 !important}
.tap button{min-height:40px !important}
.scroll-sm{flex-wrap:nowrap !important;overflow-x:auto;padding-bottom:2px}
.scroll-sm > *{flex:none}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
<style>
.lp-scene{perspective:1800px}
.lp-main{transform:rotateX(9deg);transform-origin:50% 100%;animation:lpRise 1s cubic-bezier(.2,.7,.2,1) both}

.lp-nav a:hover{color:#FFFFFF !important}
.lp-wave{position:absolute;inset:0;pointer-events:none}
