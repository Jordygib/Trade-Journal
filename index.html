<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.55; color: #C9D6D0">Import your broker file and every fill is grouped into the strategy you traded, from iron condors to double diagonals.</p>
</article>

<p style="margin: 8px 0 0; font-size: 16px; line-height: 1.55; color: #C9D6D0">See what each habit costs you, then replay your history with one change to see what would have happened.</p>

<section id="faq" aria-labelledby="fq" style="padding: 88px 0 0"><h2 id="fq" style="margin: 0; text-align: center; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 44px; font-weight: 700">Good questions</h2><div class="qs-faq" style="max-width: 820px; margin: 32px auto 0; border-top: 1px solid #22302B"><details style="border-bottom: 1px solid #22302B"><summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; cursor: pointer; list-style: none; font-size: 19px; font-weight: 600; color: #EEF4F1">Is it really free?<span aria-hidden="true" style="color: #D8B25A; font-size: 26px">+</span></summary><p style="margin: 0 0 22px; font-size: 16px; line-height: 1.65; color: #C9D6D0">Yes. While Quillstrike is in early access, every feature is free, including everything listed under Pro. If paid plans launch later, we’ll tell you first, and you’ll only pay if you choose a plan.</p></details><details style="border-bottom: 1px solid #22302B"><summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; cursor: pointer; list-style: none; font-size: 19px; font-weight: 600; color: #EEF4F1">Which brokers work?<span aria-hidden="true" style="color: #D8B25A; font-size: 26px">+</span></summary><p style="margin: 0 0 22px; font-size: 16px; line-height: 1.65; color: #C9D6D0">CSV files from tastytrade, Schwab, thinkorswim, Robinhood, and Webull are recognized automatically. Other brokers work through a quick column-matching step.</p></details><details style="border-bottom: 1px solid #22302B"><summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; cursor: pointer; list-style: none; font-size: 19px; font-weight: 600; color: #EEF4F1">Is my trading data private?<span aria-hidden="true" style="color: #D8B25A; font-size: 26px">+</span></summary><p style="margin: 0 0 22px; font-size: 16px; line-height: 1.65; color: #C9D6D0">Yes. Your journal is private to your account unless you choose to share a trade. We never sell your data, and you can download or delete everything from Settings.</p></details><details style="border-bottom: 1px solid #22302B"><summary style="display: flex; justify-content: space-between; align-items: center; gap: 16px; min-height: 64px; cursor: pointer; list-style: none; font-size: 19px; font-weight: 600; color: #EEF4F1">Do you tell me what to trade?<span aria-hidden="true" style="color: #D8B25A; font-size: 26px">+</span></summary><p style="margin: 0 0 22px; font-size: 16px; line-height: 1.65; color: #C9D6D0">No. Quillstrike shows what your own history says and lets you set your own rules. It’s a journal and analytics tool, not investment advice.</p></details></div></section>
